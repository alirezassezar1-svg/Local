<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#05070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NONONICK">
<meta name="description" content="NONONICK DIGITAL OS — local-first digital engineering workspace">
<title>NONONICK DIGITAL OS</title>
<style>
:root{
  --bg:#05070c;--bg2:#0a0f18;--panel:rgba(17,23,35,.78);--panel2:rgba(26,34,50,.55);
  --line:rgba(120,170,255,.13);--line2:rgba(120,170,255,.30);
  --txt:#e7eefb;--dim:#8ea0bb;--mut:#5f7391;
  --ac:#2ea8ff;--ac2:#22d3ee;--pu:#8b5cf6;--ok:#34d399;--wn:#fbbf24;--er:#f87171;
  --r:14px;--sh:0 10px 30px rgba(0,0,0,.45);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
}
[data-theme="light"]{
  --bg:#e9eef7;--bg2:#f6f8fd;--panel:rgba(255,255,255,.88);--panel2:rgba(238,244,255,.75);
  --line:rgba(20,60,120,.14);--line2:rgba(20,90,180,.32);
  --txt:#0a1420;--dim:#4b5c75;--mut:#7186a1;
  --sh:0 10px 28px rgba(30,60,110,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg);color:var(--txt);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 520px at 10% -10%,rgba(46,168,255,.16),transparent 62%),
    radial-gradient(700px 500px at 100% 0%,rgba(139,92,246,.13),transparent 58%),
    radial-gradient(820px 620px at 50% 118%,rgba(34,211,238,.09),transparent 62%);
}
[data-theme="light"] body::before{
  background:
    radial-gradient(900px 520px at 10% -10%,rgba(46,168,255,.20),transparent 62%),
    radial-gradient(700px 500px at 100% 0%,rgba(139,92,246,.13),transparent 58%),
    radial-gradient(820px 620px at 50% 118%,rgba(34,211,238,.14),transparent 62%);
}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:.2px}
h3{font-size:15px}
p{margin:.4em 0}
a{color:var(--ac)}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* ---------- Shell ---------- */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:40;
  padding:calc(8px + var(--safe-t)) calc(10px + var(--safe-r)) 8px calc(10px + var(--safe-l));
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,rgba(5,7,12,.92),rgba(5,7,12,.62));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
[data-theme="light"] #topbar{background:linear-gradient(180deg,rgba(240,244,252,.94),rgba(240,244,252,.68))}
#topbar .brand{display:flex;flex-direction:column;line-height:1.05;flex:1;min-width:0}
#topbar .brand b{font-size:14px;letter-spacing:1.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .brand span{font-size:10px;color:var(--mut);letter-spacing:1.2px}
.btn{
  appearance:none;border:1px solid var(--line2);
  background:linear-gradient(180deg,rgba(46,168,255,.15),rgba(46,168,255,.05));
  color:var(--txt);padding:10px 13px;border-radius:11px;font-size:14px;font-weight:600;
  min-height:42px;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s ease,filter .15s ease;
}
.btn:active{transform:scale(.965)}
.btn.primary{background:linear-gradient(180deg,#2ea8ff,#1a7fd4);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.13);color:#ffb3b3}
[data-theme="light"] .btn.danger{color:#a01212}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:9px}
.btn.icon{min-width:42px;padding:8px;font-size:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}

#sidebar{
  position:fixed;top:0;bottom:0;inset-inline-start:0;width:290px;max-width:86vw;z-index:60;
  background:linear-gradient(180deg,rgba(8,12,20,.98),rgba(8,12,20,.94));
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-inline-end:1px solid var(--line);
  transform:translateX(-102%);transition:transform .26s cubic-bezier(.2,.8,.25,1);
  padding:calc(14px + var(--safe-t)) 12px calc(20px + var(--safe-b)) 12px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
[data-theme="light"] #sidebar{background:linear-gradient(180deg,rgba(250,252,255,.99),rgba(244,248,255,.97))}
[dir="rtl"] #sidebar{transform:translateX(102%)}
#sidebar.open{transform:translateX(0)!important}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:start;
  background:transparent;border:1px solid transparent;color:var(--txt);
  padding:11px 12px;border-radius:12px;font:inherit;font-size:14.5px;cursor:pointer;min-height:46px;
}
.nav-item .num{font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums;min-width:22px}
.nav-item .ico{width:22px;text-align:center;color:var(--ac);font-size:16px}
.nav-item.active{background:linear-gradient(90deg,rgba(46,168,255,.18),rgba(46,168,255,.03));border-color:var(--line2)}
.nav-item:active{background:rgba(46,168,255,.12)}
.nav-sep{height:1px;background:var(--line);margin:10px 6px}

#view{
  position:relative;z-index:1;
  padding:calc(64px + var(--safe-t)) calc(12px + var(--safe-r)) calc(48px + var(--safe-b)) calc(12px + var(--safe-l));
  max-width:1100px;margin:0 auto;
}
.mod{display:flex;flex-direction:column;gap:12px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mod-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mod-head h2{font-size:18px;flex:1;min-width:150px}
.mod-head .sub{font-size:11.5px;color:var(--mut);letter-spacing:.4px}

/* ---------- Panels & controls ---------- */
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;
}
.panel-h{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h3{flex:1;min-width:110px;font-size:13.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}
.panel-b{padding:13px;display:flex;flex-direction:column;gap:11px}
.panel-b.tight{padding:9px;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.tight{gap:6px}
.grow{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim)}
.inp{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:11px;padding:11px 12px;font:inherit;font-size:15px;min-height:44px;
  outline:none;-webkit-appearance:none;appearance:none;
}
.inp:focus{border-color:var(--line2);box-shadow:0 0 0 3px rgba(46,168,255,.13)}
textarea.inp{min-height:96px;resize:vertical;line-height:1.45;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir="rtl"] select.inp{background-position:17px 20px,12px 20px}
.hint{font-size:12px;color:var(--mut);line-height:1.5}
.warn-box{border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.08);color:var(--wn);border-radius:11px;padding:10px 12px;font-size:12.5px;line-height:1.55}
.info-box{border:1px solid var(--line2);background:rgba(46,168,255,.07);border-radius:11px;padding:10px 12px;font-size:12.5px;line-height:1.55;color:var(--dim)}
.err-box{border:1px solid rgba(248,113,113,.42);background:rgba(248,113,113,.09);border-radius:11px;padding:10px 12px;font-size:12.5px;line-height:1.55;color:var(--er);word-break:break-word}
.ok-box{border:1px solid rgba(52,211,153,.38);background:rgba(52,211,153,.08);border-radius:11px;padding:10px 12px;font-size:12.5px;line-height:1.55;color:var(--ok);word-break:break-word}
.kv{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--dim);font-size:12px}
.kv dd{margin:0;word-break:break-word;font-variant-numeric:tabular-nums}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
pre.out{
  background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:11px;padding:11px;
  font-size:12px;line-height:1.5;overflow:auto;max-height:46vh;white-space:pre-wrap;word-break:break-word;margin:0;
}
[data-theme="light"] pre.out{background:rgba(230,238,250,.75)}
.tabs{display:flex;gap:5px;overflow-x:auto;padding:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:9px;
  padding:8px 12px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer;min-height:38px;font-weight:600;
}
.tab.active{color:var(--txt);border-color:var(--line2);background:rgba(46,168,255,.13)}
.list{display:flex;flex-direction:column;gap:8px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  display:flex;gap:10px;align-items:flex-start;cursor:pointer;
}
.item:active{background:var(--panel2)}
.item .body{flex:1;min-width:0}
.item .t{font-weight:620;font-size:14.5px;word-break:break-word}
.item .s{font-size:12px;color:var(--dim);margin-top:2px;word-break:break-word}
.item .m{font-size:11px;color:var(--mut);margin-top:5px;display:flex;gap:9px;flex-wrap:wrap}
.pill{display:inline-block;font-size:10.5px;letter-spacing:.4px;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--dim);background:rgba(46,168,255,.08)}
.pill.ok{border-color:rgba(52,211,153,.45);color:var(--ok);background:rgba(52,211,153,.09)}
.pill.wn{border-color:rgba(251,191,36,.45);color:var(--wn);background:rgba(251,191,36,.09)}
.pill.er{border-color:rgba(248,113,113,.45);color:var(--er);background:rgba(248,113,113,.09)}
.pill.pu{border-color:rgba(139,92,246,.45);color:#b79cff;background:rgba(139,92,246,.1)}
.empty{
  text-align:center;padding:34px 16px;color:var(--mut);border:1px dashed var(--line);border-radius:var(--r);font-size:13.5px;
}
.empty .empty-i{font-size:26px;color:var(--line2);margin-bottom:6px}
.empty .empty-s{font-size:12px;margin-top:5px;color:var(--mut);opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.mcard{
  background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px;
  display:flex;flex-direction:column;gap:5px;cursor:pointer;min-height:86px;text-align:start;font:inherit;color:inherit;
}
.mcard:active{background:var(--panel2)}
.mcard .ico{font-size:18px;color:var(--ac)}
.mcard .nm{font-size:13px;font-weight:620;line-height:1.3}
.mcard .nn{font-size:10px;color:var(--mut);letter-spacing:1px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;font-variant-numeric:tabular-nums;color:var(--ac2)}
.stat span{font-size:11px;color:var(--dim);letter-spacing:.4px;text-transform:uppercase}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px;transition:width .3s}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;padding:7px 0;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--ac);flex:0 0 auto}
.chk.done span{text-decoration:line-through;color:var(--mut)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th,table.tbl td{text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}
table.tbl th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.spin{width:20px;height:20px;border:2px solid var(--line2);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px;padding:18px;justify-content:center}

/* ---------- Overlays ---------- */
.overlay{
  position:fixed;inset:0;z-index:80;background:rgba(2,4,8,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:16px;
  padding-top:calc(16px + var(--safe-t));padding-bottom:calc(16px + var(--safe-b));
}
.overlay.hidden{display:none}
.modal{
  width:100%;max-width:560px;max-height:86vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(13,19,30,.99),rgba(10,15,24,.99));
  border:1px solid var(--line2);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden;
}
[data-theme="light"] .modal{background:linear-gradient(180deg,#fdfeff,#f2f6fd)}
.modal-h{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}
.modal-h h3{flex:1;font-size:15px}
.modal-b{padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:11px}
.modal-f{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal-f .btn{flex:1;min-width:110px}
#palette{position:fixed;inset:0;z-index:90;background:rgba(2,4,8,.76);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;padding-top:calc(12px + var(--safe-t))}
#palette.hidden{display:none}
.pal-box{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0;padding:0 12px 12px}
.pal-in{width:100%;background:rgba(20,27,40,.95);border:1px solid var(--line2);color:var(--txt);border-radius:13px;padding:14px 15px;font:inherit;font-size:16px;outline:none;min-height:52px}
[data-theme="light"] .pal-in{background:#fff}
.pal-res{margin-top:10px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px;padding-bottom:20px}
.pal-item{display:flex;gap:11px;align-items:center;background:rgba(20,27,40,.85);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;color:var(--txt);font:inherit;text-align:start;min-height:52px}
[data-theme="light"] .pal-item{background:#fff}
.pal-item .ico{color:var(--ac);font-size:16px;width:20px;text-align:center}
.pal-item .body{flex:1;min-width:0}
.pal-item .t{font-size:14px;font-weight:600}
.pal-item .s{font-size:11.5px;color:var(--mut)}
.pal-item.active{border-color:var(--line2);background:rgba(46,168,255,.16)}
#toasts{position:fixed;inset-inline:0;bottom:calc(16px + var(--safe-b));z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{
  max-width:520px;width:100%;background:rgba(16,22,34,.97);border:1px solid var(--line2);
  color:var(--txt);border-radius:12px;padding:11px 14px;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.5);
  transition:opacity .3s,transform .3s;word-break:break-word;
}
[data-theme="light"] .toast{background:#fff}
.toast.err{border-color:rgba(248,113,113,.6)}
.toast.ok{border-color:rgba(52,211,153,.5)}
.toast.out{opacity:0;transform:translateY(8px)}
.spacer{height:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
svg.flow{width:100%;height:330px;display:block;background:rgba(0,0,0,.22);border-radius:12px;border:1px solid var(--line);touch-action:pan-y}
[data-theme="light"] svg.flow{background:rgba(235,242,252,.7)}
svg.flow [data-node]{touch-action:none;cursor:grab}
iframe.preview{width:100%;height:260px;border:1px solid var(--line);border-radius:11px;background:#fff}
.step-card{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel2);display:flex;flex-direction:column;gap:8px}
.step-card .sh{display:flex;gap:7px;align-items:center}
.step-card .sh b{flex:1;font-size:12.5px;color:var(--ac2);letter-spacing:.5px;text-transform:uppercase}
.log-line{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;padding:2px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.log-line .lv{min-width:46px;color:var(--mut)}
.log-line.err .msg{color:var(--er)}
.log-line.warn .msg{color:var(--wn)}
.log-line.ok .msg{color:var(--ok)}
@media(min-width:820px){
  #view{padding-inline:20px}
  #sidebar{transform:translateX(-102%)}
  .modal{max-width:620px}
}
</style>
</head>
<body>

<header id="topbar">
  <button class="btn icon ghost" id="menuBtn" aria-label="Menu">☰</button>
  <div class="brand">
    <b>NONONICK DIGITAL OS</b>
    <span id="brandSub">LOCAL-FIRST ENGINEERING WORKSPACE</span>
  </div>
  <button class="btn icon ghost" id="paletteBtn" aria-label="Command palette">⌘</button>
  <button class="btn icon ghost" id="themeBtn" aria-label="Toggle theme">◐</button>
  <button class="btn icon ghost" id="langBtn" aria-label="Toggle language">ع</button>
</header>

<div id="scrim"></div>

<aside id="sidebar" aria-label="Navigation">
  <nav id="navList"></nav>
  <div class="nav-sep"></div>
  <div class="panel-b tight" style="padding:6px 4px">
    <div class="hint" id="storageLine">—</div>
  </div>
</aside>

<main id="view" role="main"></main>

<div id="palette" class="hidden" role="dialog" aria-label="Command palette">
  <div class="pal-box">
    <input id="palInput" class="pal-in" type="search" placeholder="Search modules, records, or type a command…" autocomplete="off" spellcheck="false">
    <div id="palRes" class="pal-res"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toasts" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* =========================================================================
   0. UTILITIES
   ========================================================================= */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const uid = (p) => (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const now = () => Date.now();

function esc(s){
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function fmtBytes(n){
  if (n === null || n === undefined || isNaN(n)) return '—';
  if (n < 1024) return n + ' B';
  const u = ['KB','MB','GB','TB']; let i = -1, v = n;
  do { v /= 1024; i++; } while (v >= 1024 && i < u.length - 1);
  return v.toFixed(v < 10 ? 2 : 1) + ' ' + u[i];
}
function fmtDate(ts){

function debounce(fn, ms){
  let t; return function(){ const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms); };
}

/* DOM builder ------------------------------------------------------------ */
function h(tag, props){
  const e = document.createElement(tag);
  props = props || {};
  Object.keys(props).forEach(function(k){
    const v = props[k];
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;               // only with pre-escaped content
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.slice(0,2) === 'on' && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  });
  for (let i = 2; i < arguments.length; i++){
    const kids = arguments[i];
    (Array.isArray(kids) ? kids : [kids]).forEach(function(kid){
      if (kid === null || kid === undefined || kid === false) return;
      e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    });
  }
  return e;
}
function frag(){ const f = document.createDocumentFragment(); for (let i=0;i<arguments.length;i++){ const a=arguments[i]; if(a) f.append(a.nodeType?a:a); } return f; }
function btn(label, opts){
  opts = opts || {};
  return h('button', { class:'btn ' + (opts.cls || ''), type:'button', onclick: opts.onClick, title: opts.title || '', disabled: opts.disabled || false }, label);
}
function inp(props){ return h('input', Object.assign({ class:'inp' }, props || {})); }
function ta(props){ return h('textarea', Object.assign({ class:'inp' }, props || {})); }
function selFrom(list, value, props){
  const s = h('select', Object.assign({ class:'inp' }, props || {}));
  list.forEach(function(o){
    s.append(h('option', { value: o[0], selected: String(o[0]) === String(value) }, o[1]));
  });
  return s;
}
function field(label, control, hint){
  return h('div', { class:'field' }, h('label', {}, label), control, hint ? h('div', { class:'hint' }, hint) : null);
}
function panel(title, bodyKids, headExtra){
  return h('section', { class:'panel' },
    title ? h('div', { class:'panel-h' }, h('h3', {}, title), headExtra || null) : null,
    h('div', { class:'panel-b' }, bodyKids)
  );
}
function emptyState(text, sub, icon){
  return h('div', { class:'empty' },
    h('div', { class:'empty-i' }, icon || '◇'),
    h('div', {}, text),
    sub ? h('div', { class:'empty-s' }, sub) : null

function loader(text){ return h('div', { class:'loading' }, h('span', { class:'spin' }), text || t('Loading…')); }
function pill(text, cls){ return h('span', { class:'pill ' + (cls || '') }, text); }
function tagsOf(arr){ return (arr || []).map(function(x){ return pill(x); }); }

/* =========================================================================
   3. DATABASE (IndexedDB)
   ========================================================================= */
const DB_NAME = 'nononick_os';
const DB_VERSION = 1;

const STORES = {
  projects:          { kp:'id', idx:[['updatedAt','updatedAt']] },
  specs:             { kp:'id', idx:[['projectId','projectId']] },
  apiRequests:       { kp:'id', idx:[] },
  apiHistory:        { kp:'id', idx:[['ts','ts']] },
  diagrams:          { kp:'id', idx:[] },
  workflows:         { kp:'id', idx:[] },
  workflowLogs:      { kp:'id', idx:[['workflowId','workflowId']] },
  siteReports:       { kp:'id', idx:[['ts','ts']] },
  perfReports:       { kp:'id', idx:[['ts','ts']] },
  assets:            { kp:'id', idx:[['hash','hash']] },
  components:        { kp:'id', idx:[] },
  componentVersions: { kp:'id', idx:[['componentId','componentId']] },
  research:          { kp:'id', idx:[] },
  tasks:             { kp:'id', idx:[['createdAt','createdAt']] },
  activity:          { kp:'id', idx:[['ts','ts']] },
  settings:          { kp:'key', idx:[] }
};
const STORE_NAMES = Object.keys(STORES);

let db = null;

function openDB(){
  return new Promise(function(resolve, reject){
    if (!('indexedDB' in window)) return reject(new Error('IndexedDB is not available in this browser or context.'));
    let req;
    try { req = indexedDB.open(DB_NAME, DB_VERSION); }
    catch(e){ return reject(e); }
    req.onupgradeneeded = function(ev){
      const d = req.result;
      STORE_NAMES.forEach(function(name){
        const def = STORES[name];
        let os;
        if (!d.objectStoreNames.contains(name)) os = d.createObjectStore(name, { keyPath: def.kp });
        else os = ev.target.transaction.objectStore(name);
        def.idx.forEach(function(pair){
          if (!os.indexNames.contains(pair[0])) os.createIndex(pair[0], pair[1], { unique:false });
        });
      });
    };
    req.onsuccess = function(){
      db = req.result;
      db.onversionchange = function(){ try { db.close(); } catch(e){} toast('Database closed by another tab.', 'err'); };
      resolve(db);
    };
    req.onerror = function(){ reject(req.error || new Error('IndexedDB open failed.')); };
    req.onblocked = function(){ reject(new Error('IndexedDB upgrade blocked by another open tab.')); };
  });
}
function reqP(r){ return new Promise(function(res, rej){ r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }
function tx(store, mode){ return db.transaction(store, mode || 'readonly').objectStore(store); }

const dbAll   = (s)        => reqP(tx(s).getAll());
const dbGet   = (s, k)     => reqP(tx(s).get(k));
const dbPut   = (s, r)     => reqP(tx(s, 'readwrite').put(r));
const dbDel   = (s, k)     => reqP(tx(s, 'readwrite').delete(k));
const dbClear = (s)        => reqP(tx(s, 'readwrite').clear());
const dbCount = (s)        => reqP(tx(s).count());
const dbBy    = (s, i, v)  => reqP(tx(s).index(i).getAll(v));

async function safePut(store, rec){
  try { await dbPut(store, rec); return true; }
  catch(err){
    const msg = (err && err.message) || String(err);
    if (err && (err.name === 'QuotaExceededError' || err.code === 22))
      toast(t('Storage quota exceeded') + '. ' + (LANG === 'fa' ? 'فایل‌های بزرگ را حذف یا پشتیبان بگیرید.' : 'Delete large assets or export a backup, then free space.'), 'err');
    else toast(t('Save failed') + ': ' + msg, 'err');
    return false;
  }
}

    if (c > 900){
      const all = await dbAll('activity');
      all.sort((a,b) => a.ts - b.ts);
      const extra = all.slice(0, all.length - 700);
      for (let i = 0; i < extra.length; i++) await dbDel('activity', extra[i].id);
    }
  } catch(e){ /* activity logging must never break the app */ }
}

function openModal(opts){
  opts = opts || {};
  return new Promise(function(resolve){
    const root = $('#modalRoot');
    let settled = false;
    function close(v){
      if (settled) return; settled = true;
      overlay.remove();
      resolve(v);
    }
    const body = h('div', { class:'modal-b' });
    (Array.isArray(opts.content) ? opts.content : [opts.content]).forEach(function(c){ if (c) body.append(c.nodeType ? c : document.createTextNode(String(c))); });

    const foot = h('div', { class:'modal-f' });
    (opts.actions || [{ label: t('Close'), value: null, cls: 'ghost' }]).forEach(function(a){
      foot.append(btn(a.label, {
        cls: a.cls || '',
        onClick: function(){
          if (typeof a.onClick === 'function'){
            const r = a.onClick();
            if (r === false) return;
          }
          close(a.value === undefined ? null : a.value);
        }
      }));
    });

    const box = h('div', { class:'modal', style: opts.wide ? { maxWidth:'720px' } : null },
      h('div', { class:'modal-h' }, h('h3', {}, opts.title || ''), btn('✕', { cls:'icon ghost', onClick: () => close(null) })),
      body, foot
    );
    const overlay = h('div', { class:'overlay', onclick: function(e){ if (e.target === overlay) close(null); } }, box);
    root.append(overlay);
    setTimeout(function(){ const f = box.querySelector('input,textarea,select'); if (f) { try { f.focus(); } catch(e){} } }, 60);
  });
}

    actions: [

      { label: opts.okLabel || t('Confirm'), value: true, cls: opts.danger === false ? 'primary' : 'danger' }
    ]
  });
  return r === true;
}

function copyText(text, okMsg){
  const done = function(){ toast(okMsg || t('Copied'), 'ok'); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){
      fallbackCopy(text) ? done() : toast(t('Copy to clipboard') + ' ' + t('Not available'), 'err');
    });
  } else {
    fallbackCopy(text) ? done() : toast(t('Copy to clipboard') + ' ' + t('Not available'), 'err');
  }
}
function fallbackCopy(text){
  try {
    const taEl = document.createElement('textarea');
    taEl.value = text; taEl.style.position = 'fixed'; taEl.style.opacity = '0';
    document.body.appendChild(taEl); taEl.select();
    const ok = document.execCommand('copy'); taEl.remove(); return ok;
  } catch(e){ return false; }
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: filename });
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
}

async function paletteSearch(q){
  q = (q || '').trim().toLowerCase();
  const cmds = paletteCommands();
  if (!q) return cmds.slice(0, 12);
  const out = [];
  cmds.forEach(function(c){ if ((c.title + ' ' + c.sub).toLowerCase().indexOf(q) >= 0) out.push(c); });

  try {
    const [projects, components, research, assets, workflows, diagrams] = await Promise.all([
      dbAll('projects'), dbAll('components'), dbAll('research'), dbAll('assets'), dbAll('workflows'), dbAll('diagrams')
    ]);
    function add(list, icon, label, sub, route, params){
      list.forEach(function(r){
        const hay = ((r.name || r.title || '') + ' ' + (r.description || r.notes || '') + ' ' + ((r.tags || []).join(' '))).toLowerCase();
        if (hay.indexOf(q) >= 0) out.push({ icon: icon, title: r.name || r.title || '(untitled)', sub: sub, run: function(){ navigate(route, Object.assign({ open: r.id }, params || {})); } });
      });
    }
    add(projects, '▣', null, t('Product Engineering Studio'), 'projects');
    add(components, '❖', null, t('Component Engineering Lab'), 'components');
    add(research, '⌕', null, t('Digital Research Engine'), 'research');
    add(assets, '◫', null, t('Asset Intelligence'), 'assets');
    add(workflows, '⚙', null, t('Automation Builder'), 'automation');
    add(diagrams, '⬡', null, t('Data Flow Mapper'), 'flow');
  } catch(e){ /* DB may be unavailable; commands still work */ }

  return out.slice(0, 30);
}

function renderPalette(items){
  palItems = items;
  if (palIndex >= items.length) palIndex = Math.max(0, items.length - 1);
  const res = $('#palRes');
  res.innerHTML = '';
  if (!items.length){
    res.append(h('div', { class:'empty' }, t('No results')));
    return;
  }
  items.forEach(function(it, i){
    res.append(h('button', { class:'pal-item' + (i === palIndex ? ' active' : ''), onclick: function(){ runPalette(i); } },
      h('span', { class:'ico' }, it.icon),
      h('span', { class:'body' }, h('div', { class:'t' }, it.title), h('div', { class:'s' }, it.sub || '')),
      h('span', { class:'hint' }, '↵')
    ));
  });
}
function runPalette(i){
  const it = palItems[i];
  if (!it) return;
  closePalette();
  try { it.run(); } catch(e){ toast(String(e.message || e), 'err'); }
}
function openPalette(){
  $('#palette').classList.remove('hidden');
  const pi = $('#palInput'); pi.value = ''; palIndex = 0;
  setTimeout(function(){ try { pi.focus(); } catch(e){} }, 60);
  paletteSearch('').then(renderPalette);
}
function closePalette(){ $('#palette').classList.add('hidden'); }

  ));
  root.append(h('section', { class:'panel' }, h('div', { class:'panel-h' }, h('h3', {}, t('Storage'))), stBody));

  updateStorageLine();
  return root;
}

const SPEC_KINDS = [
  ['idea', 'Idea'], ['requirement', 'Requirements'], ['spec', 'Specifications'],
  ['architecture', 'Architecture'], ['milestone', 'Milestones'], ['checklist', 'Release Checklist']
];
const PROJECT_STATUS = [
  ['idea','Idea'], ['spec','Specifications'], ['dev','In development'], ['released','Released'], ['archived','Archived']
];
function kindLabel(k){ for (let i=0;i<SPEC_KINDS.length;i++) if (SPEC_KINDS[i][0] === k) return t(SPEC_KINDS[i][1]); return k; }
function statusLabel(s){ for (let i=0;i<PROJECT_STATUS.length;i++) if (PROJECT_STATUS[i][0] === s) return t(PROJECT_STATUS[i][1]); return s; }
function statusPill(s){
  const cls = s === 'released' ? 'ok' : (s === 'dev' ? 'pu' : (s === 'archived' ? '' : 'wn'));

}

  async function editSpec(projectId, existing, after){
    const title = inp({ type:'text', value: existing ? existing.title : '', placeholder: t('Name') });
    const kind = selFrom(SPEC_KINDS.map(function(k){ return [k[0], t(k[1])]; }), existing ? existing.kind : 'requirement');
    const body = ta({ value: existing ? (existing.body || '') : '', placeholder: t('Description') });
    const itemsArea = ta({ value: existing && existing.items ? existing.items.map(function(i){ return (i.done ? '[x] ' : '[ ] ') + i.text; }).join('\n') : '', placeholder: '[ ] item one\n[x] item two' });
    const itemsField = field(t('Release Checklist'), itemsArea, LANG === 'fa' ? 'هر خط یک آیتم. با [x] به‌عنوان انجام‌شده علامت بزنید.' : 'One item per line. Prefix with [x] for completed.');
    itemsField.style.display = 'none';

    function syncKind(){
      const isCheck = kind.value === 'milestone' || kind.value === 'checklist';
      itemsField.style.display = isCheck ? '' : 'none';
      body.parentElement.style.display = isCheck ? 'none' : '';
    }
    kind.addEventListener('change', syncKind);
    setTimeout(syncKind, 0);

    const ok = await openModal({
      title: existing ? t('Edit') : t('Add Specification'),
      content: [ field(t('Name'), title), field(t('Type'), kind), field(t('Description'), body), itemsField ],
      actions: [{ label: t('Cancel'), value:false, cls:'ghost' }, { label: t('Save'), value:true, cls:'primary' }]
    });
    if (!ok) return;
    const ti = title.value.trim();
    if (!ti){ toast(t('Name') + ' ' + (LANG==='fa'?'الزامی است':'is required'), 'err'); return; }

    const rec = existing || { id: uid('spec'), projectId: projectId, createdAt: now() };

    rec.title = ti;
    rec.kind = kind.value;
    rec.body = (rec.kind === 'milestone' || rec.kind === 'checklist') ? '' : body.value;
    rec.items = (rec.kind === 'milestone' || rec.kind === 'checklist')
      ? itemsArea.value.split('\n').map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){
          const m = l.match(/^\[(x|X|\s)\]\s*(.*)$/);
          if (m) return { text: m[2].trim(), done: m[1].toLowerCase() === 'x' };
          return { text: l, done:false };
        })

    rec.updatedAt = now();
    if (await safePut('specs', rec)){

async function fetchText(url, opts){
  opts = opts || {};
  const t0 = performance.now();
  const res = await fetch(url, { mode: opts.mode || 'cors', redirect:'follow', credentials:'omit' });
  const ttfb = performance.now() - t0;
  const ct = res.headers.get('content-type') || '';
  const ab = await res.arrayBuffer();
  const total = performance.now() - t0;
  let text = '';
  try { text = new TextDecoder('utf-8').decode(ab); } catch(e){ text = ''; }
  return { res: res, text: text, bytes: ab.byteLength, ttfb: ttfb, total: total, contentType: ct };
}

function analyzeHtml(html, baseUrl){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const q = function(s){ return doc.querySelector(s); };
  const qa = function(s){ return Array.prototype.slice.call(doc.querySelectorAll(s)); };
  const meta = function(name){
    const el = doc.querySelector('meta[name="' + name + '"]') || doc.querySelector('meta[property="' + name + '"]');
    return el ? (el.getAttribute('content') || '') : '';
  };
  const links = qa('a[href]');
  let internal = 0, external = 0;
  links.forEach(function(a){
    const href = a.getAttribute('href') || '';
    if (/^https?:\/\//i.test(href)){
      try { (new URL(href).host === new URL(baseUrl).host) ? internal++ : external++; } catch(e){ external++; }
    } else if (href && href[0] !== '#') internal++;
  });
  const imgs = qa('img');
  const headings = {};
  ['h1','h2','h3','h4','h5','h6'].forEach(function(tag){ headings[tag] = qa(tag).length; });
  const scripts = qa('script');
  const inlineScriptBytes = scripts.filter(function(s){ return !s.getAttribute('src'); })
    .reduce(function(a, s){ return a + (s.textContent || '').length; }, 0);
  const styles = qa('link[rel="stylesheet"]');
  const hosts = {};
  qa('script[src],link[href],img[src]').forEach(function(el){
    const u = el.getAttribute('src') || el.getAttribute('href');
    if (!u) return;
    try { const host = new URL(u, baseUrl).host; hosts[host] = (hosts[host] || 0) + 1; } catch(e){}
  });
  return {
    title: q('title') ? q('title').textContent.trim() : '',
    lang: doc.documentElement.getAttribute('lang') || '',
    charset: q('meta[charset]') ? q('meta[charset]').getAttribute('charset') : meta('Content-Type'),
    description: meta('description'),
    viewport: meta('viewport'),
    canonical: q('link[rel="canonical"]') ? q('link[rel="canonical"]').getAttribute('href') : '',
    robots: meta('robots'),
    og: { title: meta('og:title'), description: meta('og:description'), image: meta('og:image'), type: meta('og:type') },
    twitter: { card: meta('twitter:card'), title: meta('twitter:title') },
    headings: headings,
    links: { total: links.length, internal: internal, external: external },
    images: { total: imgs.length, missingAlt: imgs.filter(function(i){ return !i.getAttribute('alt'); }).length, lazy: imgs.filter(function(i){ return i.getAttribute('loading') === 'lazy'; }).length },
    scripts: { total: scripts.length, external: scripts.filter(function(s){ return s.getAttribute('src'); }).length, inlineBytes: inlineScriptBytes },
    stylesheets: styles.length,
    forms: qa('form').length,
    iframes: qa('iframe').length,
    inlineStyleBytes: qa('style').reduce(function(a, s){ return a + (s.textContent||'').length; }, 0),
    htmlBytes: html.length,
    topHosts: Object.keys(hosts).map(function(k2){ return [k2, hosts[k2]]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0, 12)
  };
}

async function renderXray(params){
  const root = h('div', { class:'mod' });
  root.append(h('div', { class:'mod-head' }, h('h2', {}, t('Website X-Ray')), h('div', { class:'sub' }, '02')));

  const urlInp = inp({ type:'url', placeholder:'https://example.com', inputmode:'url', autocapitalize:'off', autocorrect:'off', spellcheck:'false' });

  async function analyze(){
    const url = urlInp.value.trim();
    if (!url){ toast(t('URL') + ' ' + (LANG==='fa'?'الزامی است':'is required'), 'err'); return; }
    let parsed;
    try { parsed = new URL(url); } catch(e){ toast('Invalid URL', 'err'); return; }
    if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:'){ toast('Only http/https URLs are supported.', 'err'); return; }

    out.innerHTML = '';
    out.append(loader(t('Analyzing…')));
    try {
      const r = await fetchText(url);
      const headers = {};
      ['cache-control','content-type','content-length','last-modified','expires','content-language','content-encoding'].forEach(function(k){
        const v = r.res.headers.get(k); if (v) headers[k] = v;
      });
      const analysis = analyzeHtml(r.text, r.res.url || url);

      out.innerHTML = '';
      out.append(h('div', { class:'ok-box' }, t('Analyze') + ' ✓ — HTTP ' + r.res.status + ' ' + (r.res.statusText || '') + ' · ' + fmtBytes(r.bytes) + ' · ' + r.total.toFixed(0) + ' ms'));

      const info = h('dl', { class:'kv' },
        h('dt', {}, 'Final URL'), h('dd', {}, r.res.url || url),
        h('dt', {}, t('Status')), h('dd', {}, String(r.res.status)),
        h('dt', {}, 'TTFB (fetch)'), h('dd', {}, r.ttfb.toFixed(0) + ' ms'),
        h('dt', {}, 'Total (fetch)'), h('dd', {}, r.total.toFixed(0) + ' ms'),
        h('dt', {}, t('Size')), h('dd', {}, fmtBytes(r.bytes)),
        h('dt', {}, 'Title'), h('dd', {}, analysis.title || '—'),
        h('dt', {}, t('Description')), h('dd', {}, analysis.description || '—'),
        h('dt', {}, 'lang'), h('dd', {}, analysis.lang || '—'),
        h('dt', {}, 'viewport'), h('dd', {}, analysis.viewport || '—'),
        h('dt', {}, 'canonical'), h('dd', {}, analysis.canonical || '—'),
        h('dt', {}, 'robots'), h('dd', {}, analysis.robots || '—'),
        h('dt', {}, 'og:title'), h('dd', {}, analysis.og.title || '—'),
        h('dt', {}, 'og:image'), h('dd', {}, analysis.og.image || '—')
      );
      out.append(panel('Metadata', [info]));

      const struct = h('dl', { class:'kv' });
      [['h1','h1'],['h2','h2'],['h3','h3'],['h4','h4'],['h5','h5'],['h6','h6']].forEach(function(p){
        struct.append(h('dt', {}, p[1].toUpperCase()), h('dd', {}, String(analysis.headings[p[0]])));
      });
      struct.append(h('dt', {}, 'Links'), h('dd', {}, analysis.links.total + ' (' + analysis.links.internal + ' internal / ' + analysis.links.external + ' external)'));
      struct.append(h('dt', {}, 'Images'), h('dd', {}, analysis.images.total + ' (missing alt: ' + analysis.images.missingAlt + ', lazy: ' + analysis.images.lazy + ')'));
      struct.append(h('dt', {}, 'Scripts'), h('dd', {}, analysis.scripts.total + ' (' + analysis.scripts.external + ' external, inline ' + fmtBytes(analysis.scripts.inlineBytes) + ')'));
      struct.append(h('dt', {}, 'Stylesheets'), h('dd', {}, String(analysis.stylesheets)));
      struct.append(h('dt', {}, 'Forms'), h('dd', {}, String(analysis.forms)));
      struct.append(h('dt', {}, 'iframes'), h('dd', {}, String(analysis.iframes)));
      out.append(panel('Structure', [struct]));

      const hd = h('table', { class:'tbl' }, h('thead', {}, h('tr', {}, h('th', {}, 'Header'), h('th', {}, 'Value'))));
      const hb = h('tbody');
      Object.keys(headers).forEach(function(k){ hb.append(h('tr', {}, h('td', {}, k), h('td', {}, headers[k]))); });
      if (!Object.keys(headers).length) hb.append(h('tr', {}, h('td', { colspan:'2' }, 'No readable headers (only CORS-safelisted response headers are visible cross-origin).')));
      hd.append(hb);
      out.append(panel('Response headers', [h('div', { class:'scroll-x' }, hd)]));

      if (analysis.topHosts.length){
        const hostTable = h('table', { class:'tbl' }, h('thead', {}, h('tr', {}, h('th', {}, 'Host'), h('th', {}, 'Refs'))));
        const hb2 = h('tbody');
        analysis.topHosts.forEach(function(p){ hb2.append(h('tr', {}, h('td', {}, p[0]), h('td', {}, String(p[1])))); });
        hostTable.append(hb2);
        out.append(panel('Resource hosts', [h('div', { class:'scroll-x' }, hostTable)]));
      }

      out.append(panel(t('Actions'), [
        h('div', { class:'row' },
          btn(t('Save'), { cls:'primary', onClick: async function(){
            const rec = { id: uid('xray'), url: url, finalUrl: r.res.url || url, status: r.res.status, bytes: r.bytes, ttfb: r.ttfb, total: r.total, headers: headers, analysis: analysis, ts: now() };
            if (await safePut('siteReports', rec)){ toast(t('Saved'), 'ok'); logAct('xray', 'Saved site report: ' + url); }
          } }),
          btn(t('Copy') + ' JSON', { onClick: function(){
            copyText(JSON.stringify({ url:url, status:r.res.status, bytes:r.bytes, headers:headers, analysis:analysis }, null, 2));
          } }),
          btn(t('Export'), { onClick: function(){
            downloadBlob(new Blob([JSON.stringify({ url:url, status:r.res.status, headers:headers, analysis:analysis }, null, 2)], { type:'application/json' }), 'xray-' + (parsed.hostname) + '.json');
          } })
        ]
      ]));
      logAct('xray', 'Analyzed ' + url + ' (HTTP ' + r.res.status + ')');
    } catch(err){
      out.innerHTML = '';
      out.append(h('div', { class:'err-box' },
        h('b', {}, t('Failed') + ': '), (err && err.message) || String(err)));
      out.append(h('div', { class:'warn-box' },
        (LANG==='fa'
          ? 'مرورگر فقط می‌تواند درخواست‌های cross-origin با CORS مجاز را بخواند. اگر سایت هدر Access-Control-Allow-Origin را نفرستد، محتوا در دسترس نیست. این یک محدودیت امنیتی مرورگر است و قابل دور زدن نیست. '
          : 'The browser can only read cross-origin responses that explicitly allow CORS (Access-Control-Allow-Origin). If the target site does not send it, the content is not accessible from JavaScript. This is a browser security boundary and cannot be bypassed. ')
        + (LANG==='fa' ? 'می‌توانید فایل HTML را ذخیره و از دکمه زیر تحلیل کنید.' : 'You can save the page HTML and analyze it locally instead.')));
      const fileInput = h('input', { type:'file', accept:'.html,.htm,text/html', style:{ display:'none' } });
      fileInput.addEventListener('change', function(){
        const f = fileInput.files && fileInput.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = function(){
          try {
            const a = analyzeHtml(String(rd.result), url);
            out.append(panel('Local HTML analysis — ' + f.name, [
              h('div', { class:'hint' }, 'Analyzed locally from the selected file. Network headers are not available for local files.'),
              h('pre', { class:'out' }, JSON.stringify(a, null, 2))
            ]));
          } catch(e){ toast('Parse error: ' + e.message, 'err'); }
        };
        rd.readAsText(f);
      });
      out.append(h('div', { class:'row' }, btn(t('Analyze') + ' local HTML file', { onClick: function(){ fileInput.click(); } }), fileInput));
    }
  }

  root.append(panel(null, [
    h('div', { class:'row' }, h('div', { class:'grow' }, urlInp), btn(t('Analyze'), { cls:'primary', onClick: analyze })),
    h('div', { class:'hint' }, LANG==='fa'
      ? 'این ابزار فقط داده‌هایی را گزارش می‌کند که مرورگر واقعاً می‌تواند دریافت کند. محدودیت‌های CORS به‌صورت شفاف اعلام می‌شوند.'
      : 'This tool reports only what the browser can genuinely retrieve. CORS limitations are disclosed, never faked.'),
    out
  ]));

  // saved reports
  const savedWrap = h('div', { class:'list' });
  async function refreshSaved(){
    savedWrap.innerHTML = '';
    let reports = [];
    try { reports = await dbAll('siteReports'); } catch(e){}
    reports.sort(function(a,b){ return b.ts - a.ts; });
    if (!reports.length){ savedWrap.append(emptyState(t('Saved reports'), 'Analyzed pages you save appear here.')); return; }
    reports.forEach(function(r){
      savedWrap.append(h('div', { class:'item', onclick: function(){ urlInp.value = r.url; analyze(); } },
        h('div', { class:'body' },
          h('div', { class:'t' }, truncate(r.url, 70)),
          h('div', { class:'s' }, (r.analysis && r.analysis.title) ? truncate(r.analysis.title, 90) : '—'),
          h('div', { class:'m' }, h('span', {}, 'HTTP ' + r.status), h('span', {}, fmtBytes(r.bytes)), h('span', {}, fmtDate(r.ts)))
        ),
        btn('✕', { cls:'icon ghost sm', onClick: async function(e){
          e.stopPropagation();
          await dbDel('siteReports', r.id); refreshSaved();
        } })
      ));
    });
  }
  root.append(panel(t('Saved reports'), [savedWrap]));
  await refreshSaved();
  return root;
}

const HTTP_METHODS = ['GET','POST','PUT','PATCH','DELETE','HEAD','OPTIONS'];

function kvEditor(rows, opts){
  opts = opts || {};
  const wrap = h('div', { class:'list' });
  function addRow(k, v, secret){
    const row = h('div', { class:'row tight' });
    const kIn = inp({ type:'text', value: k || '', placeholder:'Key' });
    const vIn = inp({ type:'text', value: v || '', placeholder:'Value' });
    const secCb = h('input', { type:'checkbox', checked: secret ? true : null, title:'Mark as secret' });
    secCb.style.width = '20px'; secCb.style.height = '20px'; secCb.style.accentColor = 'var(--ac)';
    row.append(h('div', { class:'grow' }, kIn), h('div', { class:'grow' }, vIn), h('label', { class:'hint', style:{ display:'flex', alignItems:'center', gap:'4px' } }, secCb, '🔒'),
      btn('✕', { cls:'icon ghost sm', onClick: function(){ row.remove(); } }));
    row._get = function(){ return { key: kIn.value.trim(), value: vIn.value, secret: secCb.checked }; };
    wrap.append(row);
  }
  (rows || []).forEach(function(r){ addRow(r.key, r.value, r.secret); });
  const addBtn = btn('＋ ' + t('Add'), { cls:'ghost sm', onClick: function(){ addRow('', '', false); } });
  const getter = function(){
    return Array.prototype.slice.call(wrap.children).map(function(c){ return c._get(); }).filter(function(r){ return r.key; });
  };
  return { el: h('div', { class:'list' }, wrap, addBtn), get: getter, container: wrap };
}

async function renderApi(params){
  const root = h('div', { class:'mod' });
  root.append(h('div', { class:'mod-head' }, h('h2', {}, t('API Laboratory')), h('div', { class:'sub' }, '03')));

  const methodSel = selFrom(HTTP_METHODS.map(function(m){ return [m, m]; }), 'GET', { style:{ maxWidth:'120px' } });
  const urlInp = inp({ type:'url', placeholder:'https://api.example.com/v1/resource', inputmode:'url', autocapitalize:'off', autocorrect:'off', spellcheck:'false' });
  const sendBtn = btn(t('Send'), { cls:'primary' });

  const paramsEditor = kvEditor([]);
  const headersEditor = kvEditor([]);
  const authType = selFrom([['none', t('None')],['bearer','Bearer token'],['basic','Basic auth']], 'none');
  const bearerTok = inp({ type:'password', placeholder:'Token', autocomplete:'off' });
  const basicUser = inp({ type:'text', placeholder:'Username', autocomplete:'off' });
  const basicPass = inp({ type:'password', placeholder:'Password', autocomplete:'off' });
  const authBearerBox = field('Bearer token', bearerTok, LANG==='fa'?'این مقدار به‌صورت محرمانه علامت‌گذاری می‌شود و در برون‌بری عادی حذف می‌گردد.':'Marked secret — redacted from ordinary exports.');
  const authBasicBox = h('div', { class:'list' }, field('Username', basicUser), field('Password', basicPass, LANG==='fa'?'محرمانه.':'Secret — redacted from ordinary exports.'));
  authBearerBox.style.display = 'none'; authBasicBox.style.display = 'none';
  authType.addEventListener('change', function(){
    authBearerBox.style.display = authType.value === 'bearer' ? '' : 'none';
    authBasicBox.style.display = authType.value === 'basic' ? '' : 'none';
  });

  const bodyType = selFrom([['none', t('None')],['json','JSON'],['text','Text'],['form','x-www-form-urlencoded']], 'none');
  const bodyArea = ta({ placeholder:'{\n  "key": "value"\n}' });
  const bodyBox = field(t('Body'), bodyArea);
  bodyBox.style.display = 'none';
  bodyType.addEventListener('change', function(){ bodyBox.style.display = bodyType.value === 'none' ? 'none' : ''; });

  const out = h('div', { class:'panel-b' });

  async function send(){
    const url0 = urlInp.value.trim();
    if (!url0){ toast(t('URL') + ' ' + (LANG==='fa'?'الزامی است':'is required'), 'err'); return; }
    let u;
    try { u = new URL(url0); } catch(e){ toast('Invalid URL', 'err'); return; }
    paramsEditor.get().forEach(function(p){ if (p.value !== '') u.searchParams.set(p.key, p.value); });

    const headers = {};
    headersEditor.get().forEach(function(p){ if (p.value !== '') headers[p.key] = p.value; });
    if (authType.value === 'bearer' && bearerTok.value) headers['Authorization'] = 'Bearer ' + bearerTok.value;
    if (authType.value === 'basic' && (basicUser.value || basicPass.value))
      headers['Authorization'] = 'Basic ' + btoa(unescape(encodeURIComponent(basicUser.value + ':' + basicPass.value)));

    const init = { method: methodSel.value, headers: headers, mode:'cors', redirect:'follow' };
    if (bodyType.value !== 'none' && methodSel.value !== 'GET' && methodSel.value !== 'HEAD'){
      if (bodyType.value === 'json'){ init.body = bodyArea.value; if (!headers['Content-Type']) headers['Content-Type'] = 'application/json'; }
      else if (bodyType.value === 'text'){ init.body = bodyArea.value; if (!headers['Content-Type']) headers['Content-Type'] = 'text/plain'; }
      else if (bodyType.value === 'form'){
        const fp = new URLSearchParams();
        bodyArea.value.split('\n').forEach(function(line){
          const i = line.indexOf('=');
          if (i > 0) fp.append(line.slice(0,i).trim(), line.slice(i+1).trim());
        });
        init.body = fp.toString();
        if (!headers['Content-Type']) headers['Content-Type'] = 'application/x-www-form-urlencoded';
      }
    }

    out.innerHTML = '';
    out.append(loader(t('Working…')));
    const t0 = performance.now();
    try {
      const res = await fetch(u.toString(), init);
      const t1 = performance.now();
      const ab = await res.arrayBuffer();
      const t2 = performance.now();
      let text = '';
      try { text = new TextDecoder('utf-8').decode(ab); } catch(e){}

      out.innerHTML = '';
      const okCls = res.ok ? 'ok-box' : 'err-box';
      out.append(h('div', { class: okCls }, 'HTTP ' + res.status + ' ' + (res.statusText || '') + ' · ' + fmtBytes(ab.byteLength) + ' · TTFB ' + (t1-t0).toFixed(0) + ' ms · total ' + (t2-t0).toFixed(0) + ' ms'));

      const hdrs = {};
      res.headers.forEach(function(v, k){ hdrs[k] = v; });
      const hTable = h('table', { class:'tbl' }, h('thead', {}, h('tr', {}, h('th', {}, 'Header'), h('th', {}, 'Value'))));

      hTable.append(hb);
      out.append(panel('Response headers', [h('div', { class:'scroll-x' }, hTable)]));

      let pretty = text;
      try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch(e){}
      out.append(panel('Response body', [
        h('div', { class:'row' }, btn(t('Copy'), { cls:'ghost sm', onClick: function(){ copyText(text); } })),
        h('pre', { class:'out' }, pretty || '(empty)')
      ]));

      try {
        await dbPut('apiHistory', {
          id: uid('hist'), method: init.method, url: u.toString(), status: res.status,
          ms: Math.round(t2 - t0), bytes: ab.byteLength, ts: now()
        });
      } catch(e){}
      logAct('api', init.method + ' ' + u.toString() + ' → ' + res.status);
      refreshHistory();
    } catch(err){
      out.innerHTML = '';
      out.append(h('div', { class:'err-box' }, h('b', {}, t('Failed') + ': '), (err && err.message) || String(err)));
      out.append(h('div', { class:'warn-box' }, LANG==='fa'
        ? 'دلایل رایج: عدم ارسال هدرهای CORS توسط سرور، DNS نامعتبر، نبود شبکه، یا مسدود شدن توسط مرورگر. مرورگر اجازه خواندن پاسخ cross-origin بدون CORS را نمی‌دهد.'
        : 'Common causes: the server does not send CORS headers, invalid DNS, no network, or the browser blocked the request. A cross-origin response without CORS headers cannot be read by JavaScript.'));
      try { await dbPut('apiHistory', { id: uid('hist'), method: init.method, url: u.toString(), status: 0, error: String((err && err.message) || err), ms: Math.round(performance.now()-t0), ts: now() }); } catch(e){}
      refreshHistory();
    }
  }
  sendBtn.addEventListener('click', send);

  const tabs = h('div', { class:'tabs' });
  const tabPanels = {
    params: h('div', { class:'panel-b' }, paramsEditor.el),
    headers: h('div', { class:'panel-b' }, headersEditor.el),
    auth: h('div', { class:'panel-b' }, field(t('Auth'), authType), authBearerBox, authBasicBox,
      h('div', { class:'hint' }, LANG==='fa'?'توکن‌ها فقط در حافظه محلی ذخیره می‌شوند و هرگز به‌صورت خودکار ارسال نمی‌گردند.':'Credentials are stored locally only and are never transmitted automatically — only when you press Send.')),
    body: h('div', { class:'panel-b' }, field('Content-Type', bodyType), bodyBox)
  };
  let activeTab = 'params';
  function selectTab(id){
    activeTab = id;
    $$('.tab', tabs).forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab') === id); });
    Object.keys(tabPanels).forEach(function(k){ tabPanels[k].style.display = k === id ? '' : 'none'; });
  }
  [['params', t('Parameters')],['headers', t('Headers')],['auth', t('Auth')],['body', t('Body')]].forEach(function(p){
    tabs.append(h('button', { class:'tab', 'data-tab': p[0], onclick: function(){ selectTab(p[0]); } }, p[1]));

  root.append(panel(null, [

    h('div', { class:'row' },
      btn(t('Save'), { onClick: async function(){
        const nm = await openModal({
          title: t('Save'),
          content: field(t('Name'), inp({ type:'text', id:'reqName', placeholder: t('Name') })),
          actions: [{ label:t('Cancel'), value:null, cls:'ghost' }, { label:t('Save'), value:true, cls:'primary' }]
        });
        if (!nm) return;
        const nmEl = $('#modalRoot input'); // already removed; use prompt-less approach
        // Build record directly
        const nameVal = (window.__lastApiName || '').trim() || ('Request ' + new Date().toLocaleTimeString());
        const rec = {
          id: uid('req'), name: nameVal, method: methodSel.value, url: urlInp.value.trim(),
          params: paramsEditor.get(), headers: headersEditor.get(),
          authType: authType.value, bearer: bearerTok.value, user: basicUser.value, pass: basicPass.value,
          bodyType: bodyType.value, body: bodyArea.value, createdAt: now(), updatedAt: now()
        };
        if (await safePut('apiRequests', rec)){ toast(t('Saved'), 'ok'); logAct('api', 'Saved request: ' + nameVal); refreshSaved(); }
      } }),
      btn(t('Export') + ' JSON', { onClick: function(){

      } })
    ],
    h('div', { class:'warn-box' }, LANG==='fa'
      ? '⚠️ برون‌بری با اسرار شامل توکن‌ها و گذرواژه‌ها به‌صورت متن ساده است. فقط در جای امن نگهداری کنید.'
      : '⚠️ Exporting with secrets writes tokens and passwords in plain text. Store the file securely. Default export redacts all values marked secret.')
  ]));
  selectTab('params');

  // Saved requests
  const savedWrap = h('div', { class:'list' });
  async function refreshSaved(){
    savedWrap.innerHTML = '';
    let list = [];
    try { list = await dbAll('apiRequests'); } catch(e){}
    list.sort(function(a,b){ return (b.updatedAt||0) - (a.updatedAt||0); });

    list.forEach(function(r){
      savedWrap.append(h('div', { class:'item', onclick: function(){ loadRequest(r); } },
        h('div', { class:'body' },
          h('div', { class:'t' }, r.name),
          h('div', { class:'s' }, r.method + ' ' + truncate(r.url, 80)),
          h('div', { class:'m' }, h('span', {}, fmtDate(r.updatedAt)))
        ),
        btn('✕', { cls:'icon ghost sm', onClick: async function(e){
          e.stopPropagation(); await dbDel('apiRequests', r.id); refreshSaved();
        } })
      ));
    });
  }
  function loadRequest(r){
    methodSel.value = r.method || 'GET';
    urlInp.value = r.url || '';
    paramsEditor.container.innerHTML = '';
    (r.params || []).forEach(function(p){ paramsEditor.el.querySelector('button.ghost.sm').click(); });
    // rebuild editors
    rebuildKv(paramsEditor, r.params || []);
    rebuildKv(headersEditor, r.headers || []);
    authType.value = r.authType || 'none';
    bearerTok.value = r.bearer || '';
    basicUser.value = r.user || '';
    basicPass.value = r.pass || '';
    bodyType.value = r.bodyType || 'none';
    bodyArea.value = r.body || '';
    authType.dispatchEvent(new Event('change'));
    bodyType.dispatchEvent(new Event('change'));
    toast('Loaded: ' + r.name);
  }
  function rebuildKv(editor, rows){
    editor.container.innerHTML = '';
    const addBtn = editor.el.querySelector('button');
    rows.forEach(function(r){
      const ev = new MouseEvent('click', { bubbles:true });
      addBtn.dispatchEvent(ev);
      const last = editor.container.lastElementChild;
      if (last && last._get){
        const inputs = last.querySelectorAll('input');
        inputs[0].value = r.key || '';
        inputs[1].value = r.value || '';
        inputs[2].checked = !!r.secret;
      }
    });
  }
  function exportRequests(withSecrets){
    dbAll('apiRequests').then(function(list){
      const data = list.map(function(r){
        const c = JSON.parse(JSON.stringify(r));
        if (!withSecrets){
          c.headers = (c.headers || []).map(function(x){ return x.secret ? { key:x.key, value:'***REDACTED***', secret:true } : x; });
          c.bearer = c.bearer ? '***REDACTED***' : '';
          c.pass = c.pass ? '***REDACTED***' : '';
        }
        return c;
      });
      downloadBlob(new Blob([JSON.stringify({ format:'nononick-api-requests', formatVersion:1, exportedAt:new Date().toISOString(), includesSecrets: withSecrets, requests:data }, null, 2)], { type:'application/json' }), 'nononick-api-requests.json');
      logAct('export', 'Exported API requests' + (withSecrets ? ' (with secrets)' : ' (redacted)'));
    });
  }
  root.append(panel(t('Saved requests'), [savedWrap, h('div', { class:'row' }, btn(t('Import') + ' JSON', { onClick: importRequests }))]));

  // History
  const histWrap = h('div', { class:'list' });
  async function refreshHistory(){
    histWrap.innerHTML = '';
    let h2 = [];
    try { h2 = await dbAll('apiHistory'); } catch(e){}
    h2.sort(function(a,b){ return b.ts - a.ts; });
    h2 = h2.slice(0, 25);
    if (!h2.length){ histWrap.append(emptyState(t('History'), 'Sent requests appear here.')); return; }
    h2.forEach(function(x){
      histWrap.append(h('div', { class:'item', style:{ cursor:'default' } },
        h('div', { class:'body' },
          h('div', { class:'t' }, x.method + ' ' + truncate(x.url, 64)),
          h('div', { class:'m' },
            x.status ? pill('HTTP ' + x.status, x.status >= 200 && x.status < 300 ? 'ok' : (x.status >= 400 ? 'er' : 'wn')) : pill(t('Failed'), 'er'),
            h('span', {}, (x.ms || 0) + ' ms'),
            x.bytes ? h('span', {}, fmtBytes(x.bytes)) : null,
            h('span', {}, fmtDate(x.ts))
          )
        )
      ));
    });
  }
  root.append(panel(t('History'), [histWrap, h('div', { class:'row' }, btn(t('Delete') + ' ' + t('History'), { cls:'ghost', onClick: async function(){
    if (!(await confirmDlg('Delete all API history?'))) return;
    await dbClear('apiHistory'); refreshHistory();
  } }))]));

  async function importRequests(){
    const fi = h('input', { type:'file', accept:'.json,application/json', style:{ display:'none' } });
    document.body.appendChild(fi);
    fi.addEventListener('change', function(){
      const f = fi.files && fi.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = async function(){
        try {
          const data = JSON.parse(String(rd.result));
          const reqs = Array.isArray(data) ? data : (data.requests || []);
          let n = 0;
          for (const r of reqs){
            if (!r || !r.url) continue;
            r.id = uid('req'); r.importedAt = now();
            await safePut('apiRequests', r); n++;
          }
          toast('Imported ' + n + ' requests', 'ok');
          refreshSaved();
        } catch(e){ toast('Import failed: ' + e.message, 'err'); }
      };
      rd.readAsText(f);
      fi.remove();
    });
    fi.click();
  }

  await refreshSaved();
  await refreshHistory();

  if (params && params.action === 'new'){ urlInp.focus(); }

  return root;
}

async function renderFlow(params){
  const root = h('div', { class:'mod' });
  root.append(h('div', { class:'mod-head' }, h('h2', {}, t('Data Flow Mapper')), h('div', { class:'sub' }, '04')));

  let diagram = { id: uid('dia'), name:'Untitled diagram', nodes:[], edges:[], updatedAt: now() };
  let selected = null;

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'flow');
  svg.setAttribute('viewBox', '0 0 1000 400');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  const nameInp = inp({ type:'text', value: diagram.name, placeholder: t('Diagram name') });
  const inspector = h('div', { class:'panel-b' });

  function kindColor(k){ for (let i=0;i<NODE_KINDS.length;i++) if (NODE_KINDS[i][0] === k) return NODE_KINDS[i][2]; return '#2ea8ff'; }

  function draw(){
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
    marker.setAttribute('id','arrow'); marker.setAttribute('viewBox','0 0 10 10');
    marker.setAttribute('refX','9'); marker.setAttribute('refY','5');
    marker.setAttribute('markerWidth','6'); marker.setAttribute('markerHeight','6');
    marker.setAttribute('orient','auto-start-reverse');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d','M 0 0 L 10 5 L 0 10 z');
    path.setAttribute('fill','#5f7391');
    marker.append(path); defs.append(marker); svg.append(defs);

    diagram.edges.forEach(function(e){
      const a = diagram.nodes.find(function(n){ return n.id === e.from; });
      const b = diagram.nodes.find(function(n){ return n.id === e.to; });
      if (!a || !b) return;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', a.x + 70); line.setAttribute('y1', a.y + 26);
      line.setAttribute('x2', b.x + 70); line.setAttribute('y2', b.y + 26);
      line.setAttribute('stroke', '#5f7391'); line.setAttribute('stroke-width', '2');
      line.setAttribute('marker-end', 'url(#arrow)');
      svg.append(line);
      if (e.label){

      rect.setAttribute('width', '140'); rect.setAttribute('height', '52');

      rect.setAttribute('fill', 'rgba(20,28,44,.92)');
      rect.setAttribute('stroke', selected === n.id ? '#2ea8ff' : kindColor(n.kind));
      rect.setAttribute('stroke-width', selected === n.id ? '3' : '1.6');
      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', '70'); txt.setAttribute('y', '31');
      txt.setAttribute('text-anchor', 'middle'); txt.setAttribute('fill', '#e7eefb');
      txt.setAttribute('font-size', '14'); txt.setAttribute('font-weight', '600');
      txt.textContent = n.label.length > 16 ? n.label.slice(0,15) + '…' : n.label;
      g.append(rect, txt);

  function renderInspector(){

    const n = diagram.nodes.find(function(x){ return x.id === selected; });

    const kind = selFrom(NODE_KINDS.map(function(k){ return [k[0], k[1]]; }), n.kind);
    kind.addEventListener('change', function(){ n.kind = kind.value; draw(); });
    const connectSel = selFrom([['','—']].concat(diagram.nodes.filter(function(x){ return x.id !== n.id; }).map(function(x){ return [x.id, x.label]; })), '');
    inspector.append(
      field(t('Name'), label),
      field(t('Type'), kind),
      h('div', { class:'row' },
        btn(t('Connect') + ' →', { cls:'primary sm', onClick: function(){

          draw();
        } }),
        h('div', { class:'grow' }, connectSel),
        btn(t('Delete'), { cls:'danger sm', onClick: function(){
          diagram.nodes = diagram.nodes.filter(function(x){ return x.id !== n.id; });
          diagram.edges = diagram.edges.filter(function(e){ return e.from !== n.id && e.to !== n.id; });
          selected = null; draw();
        } })
      ),
      (function(){
        const edgesOfNode = diagram.edges.filter(function(e){ return e.from === n.id || e.to === n.id; });
        if (!edgesOfNode.length) return null;
        const w = h('div', { class:'list' });
        edgesOfNode.forEach(function(e){
          const other = diagram.nodes.find(function(x){ return x.id === (e.from === n.id ? e.to : e.from); });

            h('div', { class:'grow' }, lbl),
            btn('✕', { cls:'icon ghost sm', onClick: function(){
              diagram.edges = diagram.edges.filter(function(x){ return x.id !== e.id; }); draw();
            } })
          ));
        });
        return w;
      })()
    );
  }

  // drag
  let drag = null;
  svg.addEventListener('pointerdown', function(e){
    const g = e.target.closest ? e.target.closest('[data-node]') : null;
    if (!g) return;
    const id = g.getAttribute('data-node');
    const n = diagram.nodes.find(function(x){ return x.id === id; });
    if (!n) return;
    selected = id;
    const r = svg.getBoundingClientRect();
    const vb = { w:1000, h:400 };
    const scale = Math.min(r.width / vb.w, r.height / vb.h);
    const offX = (r.width - vb.w * scale) / 2;
    const offY = (r.height - vb.h * scale) / 2;
    const px = (e.clientX - r.left - offX) / scale;
    const py = (e.clientY - r.top - offY) / scale;
    drag = { id: id, dx: px - n.x, dy: py - n.y, scale: scale, offX: offX, offY: offY };
    try { svg.setPointerCapture(e.pointerId); } catch(err){}
    draw();

  svg.addEventListener('pointermove', function(e){
    if (!drag) return;
    const n = diagram.nodes.find(function(x){ return x.id === drag.id; });
    if (!n) return;
    const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left - drag.offX) / drag.scale;
    const py = (e.clientY - r.top - drag.offY) / drag.scale;
    n.x = Math.max(0, Math.min(1000 - 140, px - drag.dx));
    n.y = Math.max(0, Math.min(400 - 52, py - drag.dy));

  const tmplRow = h('div', { class:'row' });

  root.append(panel(null, [

        diagram.nodes.push(n); selected = n.id; draw();
