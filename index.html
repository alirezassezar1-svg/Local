    ),
    svg,
    h('div', { class:'legend' }, NODE_KINDS.map(function(k){
      return h('span', {}, h('i', { style:{ background:k[2] } }), k[1]);
    })),
    inspector,
    h('div', { class:'hint' }, LANG==='fa' ? 'گره‌ها را با کشیدن جابه‌جا کنید. برای اتصال، گره را انتخاب و مقصد را برگزینید.' : 'Drag nodes to move them. To connect, select a node and choose a target.'),
    h('div', { class:'panel-h' }, h('h3', {}, t('Templates'))),
    tmplRow,
    h('div', { class:'row' },
      btn(t('Save diagram'), { cls:'primary', onClick: async function(){
        diagram.name = nameInp.value.trim() || 'Untitled diagram';
        diagram.updatedAt = now();
        if (await safePut('diagrams', JSON.parse(JSON.stringify(diagram)))){ toast(t('Saved'), 'ok'); logAct('diagram', 'Saved diagram: ' + diagram.name); refreshList(); }
      } }),
      btn(t('Export JSON'), { onClick: function(){
        diagram.name = nameInp.value.trim() || diagram.name;
        downloadBlob(new Blob([JSON.stringify(diagram, null, 2)], { type:'application/json' }), 'diagram-' + diagram.name.replace(/[^\w\-]+/g,'_') + '.json');
      } }),
      btn(t('Import JSON'), { onClick: function(){
        const fi = h('input', { type:'file', accept:'.json,application/json', style:{ display:'none' } });
        document.body.appendChild(fi);
        fi.addEventListener('change', function(){
          const f = fi.files && fi.files[0]; if (!f) return;
          const rd = new FileReader();
          rd.onload = function(){
            try {
              const d = JSON.parse(String(rd.result));
              if (!d || !Array.isArray(d.nodes)) throw new Error('Invalid diagram file');
              diagram = { id: d.id || uid('dia'), name: d.name || 'Imported', nodes: d.nodes, edges: d.edges || [], updatedAt: now() };
              nameInp.value = diagram.name; selected = null; draw();
              toast(t('Done'), 'ok');
            } catch(e){ toast('Import failed: ' + e.message, 'err'); }
          };
          rd.readAsText(f); fi.remove();
        });
        fi.click();
      } })
    )
  ]));

  const listWrap = h('div', { class:'list' });
  async function refreshList(){
    listWrap.innerHTML = '';
    let list = [];
    try { list = await dbAll('diagrams'); } catch(e){}
    list.sort(function(a,b){ return (b.updatedAt||0) - (a.updatedAt||0); });
    if (!list.length){ listWrap.append(emptyState(t('Diagrams'), 'Saved diagrams appear here.')); return; }
    list.forEach(function(d){
      listWrap.append(h('div', { class:'item', onclick: function(){
        diagram = JSON.parse(JSON.stringify(d));
        nameInp.value = diagram.name; selected = null; draw();
      } },
        h('div', { class:'body' },
          h('div', { class:'t' }, d.name),
          h('div', { class:'m' }, h('span', {}, (d.nodes||[]).length + ' nodes'), h('span', {}, (d.edges||[]).length + ' links'), h('span', {}, fmtDate(d.updatedAt)))
        ),
        btn('✕', { cls:'icon ghost sm', onClick: async function(e){
          e.stopPropagation(); await dbDel('diagrams', d.id); refreshList();
        } })
      ));
    });
  }
  root.append(panel(t('Load'), [listWrap]));

  draw();
  await refreshList();
  return root;
}

/* =========================================================================
   15. MODULE 05 — AUTOMATION BUILDER
   ========================================================================= */
const STEP_TYPES = [
  ['set', 'Set variable'],
  ['math', 'Math on variable'],
  ['log', 'Log message'],
  ['delay', 'Wait (ms)'],
  ['http', 'HTTP request'],
  ['notify', 'Notification'],
  ['store', 'Write to localStorage'],
  ['read', 'Read from localStorage']
];
function stepLabel(type){ for (let i=0;i<STEP_TYPES.length;i++) if (STEP_TYPES[i][0] === type) return t(STEP_TYPES[i][1]); return type; }

function interp(s, vars){
  return String(s === undefined || s === null ? '' : s).replace(/\{([A-Za-z0-9_]+)\}/g, function(m, k){
    return Object.prototype.hasOwnProperty.call(vars, k) ? String(vars[k]) : m;
  });
}
function evalCond(when, vars){
  const L = interp(when.left, vars), R = interp(when.right, vars);
  const nl = Number(L), nr = Number(R);
  switch (when.op){
    case '==': return String(L) === String(R);
    case '!=': return String(L) !== String(R);
    case '>': return nl > nr;
    case '<': return nl < nr;
    case '>=': return nl >= nr;
    case '<=': return nl <= nr;
    case 'contains': return String(L).indexOf(String(R)) >= 0;
    case 'truthy': return !!L && L !== 'false' && L !== '0';
    default: return false;
  }
}

async function runWorkflow(wf, onLog){
  const vars = {};
  const logs = [];
  const t0 = performance.now();
  function log(level, msg){
    const e = { ts: Math.round(performance.now() - t0), level: level, msg: msg };
    logs.push(e);
    if (onLog) { try { onLog(e); } catch(err){} }
  }
  log('info', '▶ ' + (LANG==='fa'?'شروع اجرا':'Run started') + ' — ' + wf.name);
  let ok = true;
  const steps = wf.steps || [];
  for (let i = 0; i < steps.length; i++){
    const st = steps[i];
    if (!st) continue;
    try {
      if (st.when && st.when.enabled){
        const pass = evalCond(st.when, vars);
        log('info', '· ' + (i+1) + ' [' + (pass ? 'condition true' : 'condition false') + '] ' + st.when.left + ' ' + st.when.op + ' ' + st.when.right);
        if (!pass){ log('warn', '↷ skipped: ' + stepLabel(st.type)); continue; }
      }
      switch (st.type){
        case 'set': {
          const name = (st.name || '').trim();
          if (!name) throw new Error('Variable name is empty');
          vars[name] = interp(st.value, vars);
          log('info', 'set ' + name + ' = ' + vars[name]);
          break;
        }
        case 'math': {
          const name = (st.name || '').trim();
          if (!name) throw new Error('Variable name is empty');
          const a = Number(vars[name] || 0) || 0;
          const b = Number(interp(st.value, vars)) || 0;
          let r = a;
          if (st.op === '+') r = a + b;
          else if (st.op === '-') r = a - b;
          else if (st.op === '*') r = a * b;
          else if (st.op === '/') r = b === 0 ? NaN : a / b;
          vars[name] = r;
          log('info', name + ' = ' + r);
          break;
        }
        case 'log':
          log('info', interp(st.message, vars));
          break;
        case 'delay': {
          const ms = Math.max(0, Math.min(15000, Number(interp(st.ms, vars)) || 0));
          log('info', 'waiting ' + ms + ' ms');
          await sleep(ms);
          break;
        }
        case 'http': {
          const url = interp(st.url, vars);
          if (!url) throw new Error('URL is empty');
          log('info', 'HTTP ' + (st.method || 'GET') + ' ' + url);
          const init = { method: st.method || 'GET', mode:'cors' };
          if (st.body && (st.method || 'GET') !== 'GET'){ init.body = interp(st.body, vars); init.headers = { 'Content-Type':'application/json' }; }
          const res = await fetch(url, init);
          const txt = await res.text();
          log(res.ok ? 'ok' : 'err', 'HTTP ' + res.status + ' · ' + fmtBytes(txt.length));
          if (st.storeAs) { vars[st.storeAs.trim()] = txt; log('info', 'stored response in ' + st.storeAs); }
          if (!res.ok) throw new Error('HTTP ' + res.status);
          break;
        }
        case 'notify': {
          if (!('Notification' in window)) throw new Error('Notification API not supported');
          if (Notification.permission !== 'granted') throw new Error('Notification permission not granted (open Settings or tap “Enable notifications”)');
          new Notification(interp(st.title, vars) || 'NONONICK', { body: interp(st.body, vars) });
          log('ok', 'notification sent');
          break;
        }
        case 'store': {
          const key = (st.key || '').trim();
          if (!key) throw new Error('Key is empty');
          localStorage.setItem('nn_wf_' + key, interp(st.value, vars));
          log('info', 'localStorage["nn_wf_' + key + '"] written');
          break;
        }
        case 'read': {
          const key = (st.key || '').trim();
          const name = (st.name || '').trim();
          if (!name) throw new Error('Variable name is empty');
          vars[name] = localStorage.getItem('nn_wf_' + key) || '';
          log('info', name + ' = ' + vars[name]);
          break;
        }
        default:
          throw new Error('Unknown step type: ' + st.type);
      }
    } catch(err){
      ok = false;
      log('err', '✕ step ' + (i+1) + ' (' + stepLabel(st.type) + ') failed: ' + ((err && err.message) || err));
      break;
    }
  }
  log(ok ? 'ok' : 'err', (ok ? '✔ ' : '✕ ') + (LANG==='fa'?'پایان اجرا':'Run finished') + ' — ' + Math.round(performance.now() - t0) + ' ms');
  return { ok: ok, logs: logs, vars: vars };
}

async function renderAutomation(params){
  const root = h('div', { class:'mod' });
  root.append(h('div', { class:'mod-head' }, h('h2', {}, t('Automation Builder')), h('div', { class:'sub' }, '05')));

  let wf = { id: uid('wf'), name:'New workflow', description:'', trigger:{ type:'manual', seconds:60 }, steps:[], enabled:true, updatedAt: now() };
  const nameInp = inp({ type:'text', value: wf.name });
  const descInp = inp({ type:'text', value: '', placeholder: t('Description') });
  const trigSel = selFrom([['manual', t('Manual')], ['interval', t('Interval')]], 'manual');
  const trigSecs = inp({ type:'number', value:'60', min:'5', style:{ maxWidth:'110px' } });
  const stepsWrap = h('div', { class:'list' });
  const logWrap = h('div', { class:'list' });
  let intervalTimer = null;

  function newStep(type){
    const base = { id: uid('st'), type: type, when: { enabled:false, left:'', op:'==', right:'' } };
    if (type === 'set') { base.name=''; base.value=''; }
    if (type === 'math') { base.name=''; base.op='+'; base.value='1'; }
    if (type === 'log') base.message = 'Hello {name}';
    if (type === 'delay') base.ms = '500';
    if (type === 'http') { base.method='GET'; base.url='https://'; base.body=''; base.storeAs=''; }
    if (type === 'notify') { base.title='NONONICK'; base.body='Workflow finished'; }
    if (type === 'store') { base.key=''; base.value=''; }
    if (type === 'read') { base.key=''; base.name=''; }
    return base;
  }

  function renderSteps(){
    stepsWrap.innerHTML = '';
    if (!wf.steps.length){ stepsWrap.append(emptyState(t('Step') + ' — ' + t('None'), 'Add a step to build the workflow.')); return; }
    wf.steps.forEach(function(st, idx){
      const card = h('div', { class:'step-card' });
      const head = h('div', { class:'sh' },
        h('b', {}, (idx+1) + '. ' + stepLabel(st.type)),
        btn('↑', { cls:'icon ghost sm', onClick: function(){ if (idx>0){ const x = wf.steps.splice(idx,1)[0]; wf.steps.splice(idx-1,0,x); renderSteps(); } } }),
        btn('↓', { cls:'icon ghost sm', onClick: function(){ if (idx < wf.steps.length-1){ const x = wf.steps.splice(idx,1)[0]; wf.steps.splice(idx+1,0,x); renderSteps(); } } }),
        btn('✕', { cls:'icon ghost sm', onClick: function(){ wf.steps.splice(idx,1); renderSteps(); } })
      );
      card.append(head);

      function addF(label, control){ card.append(field(label, control)); }

      if (st.type === 'set'){
        const nm = inp({ type:'text', value: st.name, placeholder:'name' });
        const vl = inp({ type:'text', value: st.value, placeholder:'value or {other}' });
        nm.addEventListener('input', function(){ st.name = nm.value; });
        vl.addEventListener('input', function(){ st.value = vl.value; });
        addF('Variable name', nm); addF('Value', vl);
      } else if (st.type === 'math'){
        const nm = inp({ type:'text', value: st.name, placeholder:'counter' });
        const op = selFrom([['+','+'],['-','−'],['*','×'],['/','÷']], st.op);
        const vl = inp({ type:'text', value: st.value });
        nm.addEventListener('input', function(){ st.name = nm.value; });
        op.addEventListener('change', function(){ st.op = op.value; });
        vl.addEventListener('input', function(){ st.value = vl.value; });
        addF('Variable', nm); addF('Operation', op); addF('Value', vl);
      } else if (st.type === 'log'){
        const msg = inp({ type:'text', value: st.message });
        msg.addEventListener('input', function(){ st.message = msg.value; });
        addF('Message', msg);
      } else if (st.type === 'delay'){
        const ms = inp({ type:'number', value: st.ms, min:'0', max:'15000' });
        ms.addEventListener('input', function(){ st.ms = ms.value; });
        addF('Milliseconds (max 15000)', ms);
      } else if (st.type === 'http'){
        const m = selFrom(HTTP_METHODS.map(function(x){ return [x,x]; }), st.method);
        const u = inp({ type:'url', value: st.url, inputmode:'url', autocapitalize:'off', autocorrect:'off', spellcheck:'false' });
        const b = ta({ value: st.body, placeholder:'request body (JSON)' });
        const sa = inp({ type:'text', value: st.storeAs, placeholder:'variable name (optional)' });
        m.addEventListener('change', function(){ st.method = m.value; });
        u.addEventListener('input', function(){ st.url = u.value; });
        b.addEventListener('input', function(){ st.body = b.value; });
        sa.addEventListener('input', function(){ st.storeAs = sa.value; });
        addF(t('Method'), m); addF('URL', u); addF('Body', b); addF('Store response as', sa);
        card.append(h('div', { class:'warn-box' }, t('Requires internet') + ' — CORS rules apply.'));
      } else if (st.type === 'notify'){
        const ti = inp({ type:'text', value: st.title });
        const bo = inp({ type:'text', value: st.body });
        ti.addEventListener('input', function(){ st.title = ti.value; });
        bo.addEventListener('input', function(){ st.body = bo.value; });
        addF('Title', ti); addF('Body', bo);
        card.append(btn('Enable notifications', { cls:'ghost sm', onClick: function(){
          if (!('Notification' in window)){ toast('Notification API not supported', 'err'); return; }
          Notification.requestPermission().then(function(p){ toast('Notification permission: ' + p); });
        } }));
      } else if (st.type === 'store'){
        const k = inp({ type:'text', value: st.key });
        const v = inp({ type:'text', value: st.value });
        k.addEventListener('input', function(){ st.key = k.value; });
        v.addEventListener('input', function(){ st.value = v.value; });
        addF('Key', k); addF('Value', v);
      } else if (st.type === 'read'){
        const k = inp({ type:'text', value: st.key });
        const n2 = inp({ type:'text', value: st.name });
        k.addEventListener('input', function(){ st.key = k.value; });
        n2.addEventListener('input', function(){ st.name = n2.value; });
        addF('Key', k); addF('Store into variable', n2);
      }

      // condition
      const whenWrap = h('div', { class:'list' });
      const whenCb = h('input', { type:'checkbox', checked: st.when && st.when.enabled ? true : null });
      whenCb.style.width='20px'; whenCb.style.height='20px'; whenCb.style.accentColor='var(--ac)';
      const condRow = h('label', { class:'chk' }, whenCb, h('span', {}, t('Condition')));
      const condBody = h('div', { class:'row tight' });
      const l = inp({ type:'text', value: st.when ? st.when.left : '', placeholder:'left' });
      const o = selFrom([['==','=='],['!=','!='],['>','>'],['<','<'],['>=','>='],['<=','<='],['contains','contains'],['truthy','is truthy']], st.when ? st.when.op : '==', { style:{ maxWidth:'130px' } });
      const r = inp({ type:'text', value: st.when ? st.when.right : '', placeholder:'right' });
      l.addEventListener('input', function(){ st.when.left = l.value; });
      o.addEventListener('change', function(){ st.when.op = o.value; });
      r.addEventListener('input', function(){ st.when.right = r.value; });
      condBody.append(h('div', { class:'grow' }, l), o, h('div', { class:'grow' }, r));
      whenCb.addEventListener('change', function(){
        st.when.enabled = whenCb.checked;
        condBody.style.display = whenCb.checked ? '' : 'none';
      });
      condBody.style.display = (st.when && st.when.enabled) ? '' : 'none';
      card.append(condRow, condBody);
      card.append(h('div', { class:'hint' }, LANG==='fa' ? 'از {نام‌متغیر} برای ارجاع به متغیرها استفاده کنید.' : 'Use {variableName} to reference variables.'));

      stepsWrap.append(card);
    });
  }

  const addStepRow = h('div', { class:'row' });
  STEP_TYPES.forEach(function(s){
    addStepRow.append(btn('＋ ' + stepLabel(s[0]), { cls:'ghost sm', onClick: function(){ wf.steps.push(newStep(s[0])); renderSteps(); } }));
  });

  trigSel.addEventListener('change', function(){
    wf.trigger.type = trigSel.value;
    trigSecs.parentElement.style.display = trigSel.value === 'interval' ? '' : 'none';
  });
  trigSecs.parentElement = null;

  function pushLog(e){
    logWrap.append(h('div', { class:'log-line ' + e.level },
      h('span', { class:'lv' }, e.level),
      h('span', { class:'msg' }, e.msg)
    ));
    logWrap.scrollTop = logWrap.scrollHeight;
  }

  async function doRun(){
    wf.name = nameInp.value.trim() || 'Workflow';
    logWrap.innerHTML = '';
    const res = await runWorkflow(wf, pushLog);
    try {
      await dbPut('workflowLogs', { id: uid('log'), workflowId: wf.id, name: wf.name, ok: res.ok, logs: res.logs, vars: res.vars, ts: now() });
    } catch(e){}
    logAct('workflow', 'Ran workflow "' + wf.name + '" → ' + (res.ok ? 'success' : 'failed'));
    toast(res.ok ? t('Done') : t('Failed'), res.ok ? 'ok' : 'err');
  }

  root.append(panel(null, [
    h('div', { class:'row' },
      h('div', { class:'grow' }, nameInp),
      btn('▶ ' + t('Run workflow'), { cls:'primary', onClick: doRun })
    ),
    field(t('Description'), descInp),
    h('div', { class:'row' },
      h('div', { class:'grow' }, field(t('Trigger'), trigSel)),
      field('Seconds', trigSecs)
    ),
    h('div', { class:'row' },
      btn('▶ ' + (LANG==='fa'?'شروع زمان‌بند':'Start interval'), { onClick: function(){
        if (intervalTimer) { clearInterval(intervalTimer); intervalTimer = null; toast('Interval stopped'); return; }
        const s = Math.max(5, Number(trigSecs.value) || 60);
        intervalTimer = setInterval(function(){ doRun(); }, s * 1000);
        onCleanup(function(){ if (intervalTimer) clearInterval(intervalTimer); });
        toast('Interval started: every ' + s + 's (only while this app is open)');
      } }),
      btn('■ ' + (LANG==='fa'?'توقف':'Stop interval'), { onClick: function(){
        if (intervalTimer){ clearInterval(intervalTimer); intervalTimer = null; toast('Interval stopped'); }
      } })
    ),
    h('div', { class:'warn-box' }, LANG==='fa'
      ? 'زمان‌بندها فقط تا زمانی که این برنامه باز است اجرا می‌شوند. اجرای پس‌زمینه نیازمند Service Worker و میزبانی HTTPS است.'
      : 'Interval triggers run only while this app is open. Background execution would require a Service Worker on an HTTPS origin, which a local HTML file cannot register.')
  ]));

  root.append(panel(t('Step'), [addStepRow, stepsWrap]));

  root.append(panel(t('Execution log'), [
    h('div', { class:'row' },
      btn('▶ ' + t('Run workflow'), { onClick: doRun }),
      btn(t('Save'), { onClick: async function(){
        wf.name = nameInp.value.trim() || 'Workflow';
        wf.description = descInp.value;
        wf.trigger.type = trigSel.value;
        wf.trigger.seconds = Math.max(5, Number(trigSecs.value) || 60);
        wf.updatedAt = now();
        if (await safePut('workflows', JSON.parse(JSON.stringify(wf)))){ toast(t('Saved'), 'ok'); logAct('workflow', 'Saved workflow: ' + wf.name); refreshList(); }
      } }),
      btn(t('Export'), { onClick: function(){
        downloadBlob(new Blob([JSON.stringify(wf, null, 2)], { type:'application/json' }), 'workflow-' + wf.name.replace(/[^\w\-]+/g,'_') + '.json');
      } }),
      btn(t('Import'), { onClick: function(){
        const fi = h('input', { type:'file', accept:'.json,application/json', style:{ display:'none' } });
        document.body.appendChild(fi);
        fi.addEventListener('change', function(){
          const f = fi.files && fi.files[0]; if (!f) return;
          const rd = new FileReader();
          rd.onload = function(){
            try {
              const d = JSON.parse(String(rd.result));
              if (!d || !Array.isArray(d.steps)) throw new Error('Invalid workflow file');
              wf = { id: d.id || uid('wf'), name: d.name || 'Imported', description: d.description || '', trigger: d.trigger || { type:'manual', seconds:60 }, steps: d.steps, enabled:true, updatedAt: now() };
              nameInp.value = wf.name; descInp.value = wf.description; trigSel.value = wf.trigger.type || 'manual'; trigSecs.value = wf.trigger.seconds || 60;
              renderSteps(); toast(t('Done'), 'ok');
            } catch(e){ toast('Import failed: ' + e.message, 'err'); }
          };
          rd.readAsText(f); fi.remove();
        });
        fi.click();
      } })
    ),
    h('div', { class:'scroll-x', style:{ maxHeight:'260px', overflowY:'auto' } }, logWrap)
  ]));

  const listWrap = h('div', { class:'list' });
  async function refreshList(){
    listWrap.innerHTML = '';
    let list = [];
    try { list = await dbAll('workflows'); } catch(e){}
    list.sort(function(a,b){ return (b.updatedAt||0) - (a.updatedAt||0); });
    if (!list.length){ listWrap.append(emptyState(t('New workflow'), 'Saved workflows appear here.')); return; }
    list.forEach(function(w){
      listWrap.append(h('div', { class:'item', onClick: null, onclick: function(){
        wf = JSON.parse(JSON.stringify(w));
        nameInp.value = wf.name; descInp.value = wf.description || '';
        trigSel.value = wf.trigger.type || 'manual'; trigSecs.value = wf.trigger.seconds || 60;
        renderSteps();
      } },
        h('div', { class:'body' },
          h('div', { class:'t' }, w.name),
          h('div', { class:'m' }, h('span', {}, (w.steps || []).length + ' steps'), h('span', {}, w.trigger && w.trigger.type === 'interval' ? 'interval' : 'manual'), h('span', {}, fmtDate(w.updatedAt)))
        ),
        btn('✕', { cls:'icon ghost sm', onClick: async function(e){
          e.stopPropagation(); await dbDel('workflows', w.id); refreshList();
        } })
      ));
    });
  }
  root.append(panel(t('New workflow'), [listWrap]));

  renderSteps();
  await refreshList();
  if (params && params.open){
    try {
      const w = await dbGet('workflows', params.open);
      if (w){ wf = JSON.parse(JSON.stringify(w)); nameInp.value = wf.name; renderSteps(); }
    } catch(e){}
  }
  return root;
}

/* =========================================================================
   16. MODULE 06 — PERFORMANCE OBSERVATORY
   ========================================================================= */
async function renderPerf(params){
  const root = h('div', { class:'mod' });
  root.append(h('div', { class:'mod-head' }, h('h2', {}, t('Performance Observatory')), h('div', { class:'sub' }, '06')));

  root.append(h('div', { class:'warn-box' }, LANG==='fa'
    ? 'این ابزار اندازه‌گیری‌های واقعی مرورگر را گزارش می‌کند — نه Lighthouse. هیچ پایش پیوسته‌ای وجود ندارد؛ بررسی‌ها فقط همین حالا و توسط شما اجرا می‌شوند.'
    : 'This module reports real browser measurements — it is not Lighthouse. There is no continuous monitoring; checks run now, on demand, while the page is open.'));

  // --- URL check
  const urlInp = inp({ type:'url', placeholder:'https://example.com', inputmode:'url', autocapitalize:'off', autocorrect:'off', spellcheck:'false' });
  const urlOut = h('div', { class:'panel-b' });

  async function checkUrl(){
    const u = urlInp.value.trim();
    if (!u){ toast('URL required', 'err'); return; }
    urlOut.innerHTML = ''; urlOut.append(loader(t('Working…')));
    const t0 = performance.now();
    try {
      const res = await fetch(u, { mode:'cors', credentials:'omit' });
      const t1 = performance.now();
      const reader = res.body && res.body.getReader ? res.body.getReader() : null;
      let firstByteAt = null, total = 0;
      if (reader){
        while (true){
          const chunk = await reader.read();
          if (chunk.done) break;
          if (firstByteAt === null) firstByteAt = performance.now();
          total += chunk.value ? chunk.value.byteLength : 0;
        }
      } else {
        const ab = await res.arrayBuffer(); total = ab.byteLength; firstByteAt = performance.now();
      }
      const t2 = performance.now();
      urlOut.innerHTML = '';
      const rows = h('dl', { class:'kv' },
        h('dt', {}, 'Status'), h('dd', {}, String(res.status) + ' ' + (res.statusText || '')),
        h('dt', {}, 'TTFB (first chunk)'), h('dd', {}, (firstByteAt ? (firstByteAt - t0).toFixed(0) : '—') + ' ms'),
        h('dt', {}, 'Headers received'), h('dd', {}, (t1 - t0).toFixed(0) + ' ms'),
        h('dt', {}, 'Body complete'), h('dd', {}, (t2 - t0).toFixed(0) + ' ms'),
        h('dt', {}, 'Payload'), h('dd', {}, fmtBytes(total)),
        h('dt', {}, 'content-encoding'), h('dd', {}, res.headers.get('content-encoding') || 'not exposed'),
        h('dt', {}, 'cache-control'), h('dd', {}, res.headers.get('cache-control') || 'not exposed'),
        h('dt', {}, 'content-length'), h('dd', {}, res.headers.get('content-length') || 'not exposed')
      );
      urlOut.append(panel('Fetch measurement', [rows]));
      urlOut.append(h('div', { class:'hint' }, LANG==='fa'
        ? 'زمان DNS/TCP/TLS در حالت cross-origin قابل تفکیک نیست. مقادیر فوق اندازه‌گیری مستقیم همین fetch هستند.'
        : 'DNS/TCP/TLS timings cannot be separated for a cross-origin fetch from JavaScript. These numbers are direct measurements of this specific fetch.'));

      // same-origin resource timing (real data about THIS document)
      try {
        const entries = performance.getEntriesByType('resource').slice(0, 30);
        if (entries.length){
          const tbl = h('table', { class:'tbl' }, h('thead', {}, h('tr', {}, h('th', {}, 'Resource'), h('th', {}, 'Duration'), h('th', {}, 'Transfer'))));
          const tb = h('tbody');
          entries.forEach(function(e){
            tb.append(h('tr', {}, h('td', {}, truncate(e.name.split('/').pop() || e.name, 34)), h('td', {}, e.duration.toFixed(1) + ' ms'), h('td', {}, fmtBytes(e.transferSize || 0))));
          });
          tbl.append(tb);
          urlOut.append(panel('Resource timings (this page)', [h('div', { class:'scroll-x' }, tbl)]));
        }
      } catch(e){}

      const rep = { id: uid('perf'), kind:'url', url: u, status: res.status, ttfb: firstByteAt ? Math.round(firstByteAt - t0) : null,
        total: Math.round(t2 - t0), bytes: total, ts: now() };
      await safePut('perfReports', rep);
      logAct('perf', 'Measured fetch: ' + u + ' (' + rep.total + ' ms)');
      refreshList();
    } catch(err){
      urlOut.innerHTML = '';
      urlOut.append(h('div', { class:'err-box' }, h('b', {}, t('Failed') + ': '), (err && err.message) || String(err)));
      urlOut.append(h('div', { class:'warn-box' }, LANG==='fa'
        ? 'بدون CORS، اندازه‌گیری از جاوااسکریپت ممکن نیست. این یک محدودیت امنیتی مرورگر است.'
        : 'Without CORS permission the measurement cannot be taken from JavaScript. This is a browser security boundary, not a bug.'));
    }
  }

  root.append(panel('URL check', [
    h('div', { class:'row' }, h('div', { class:'grow' }, urlInp), btn(t('Run'), { cls:'primary', onClick: checkUrl })),
    urlOut
  ]));

  // --- Navigation timing for this document
  try {
    const nav = performance.getEntriesByType('navigation')[0];
    if (nav){
      const rows = h('dl', { class:'kv' },
        h('dt', {}, 'DNS'), h('dd', {}, (nav.domainLookupEnd - nav.domainLookupStart).toFixed(0) + ' ms'),
        h('dt', {}, 'TCP'), h('dd', {}, (nav.connectEnd - nav.connectStart).toFixed(0) + ' ms'),
        h('dt', {}, 'TLS'), h('dd', {}, nav.secureConnectionStart ? (nav.connectEnd - nav.secureConnectionStart).toFixed(0) + ' ms' : 'n/a'),
        h('dt', {}, 'TTFB'), h('dd', {}, (nav.responseStart - nav.requestStart).toFixed(0) + ' ms'),
        h('dt', {}, 'DOM interactive'), h('dd', {}, nav.domInteractive.toFixed(0) + ' ms'),
        h('dt', {}, 'DOM complete'), h('dd', {}, nav.domComplete.toFixed(0) + ' ms'),
        h('dt', {}, 'Transfer size'), h('dd', {}, fmtBytes(nav.transferSize || 0))
      );
      root.append(panel('This page — Navigation Timing', [rows, h('div', { class:'hint' }, 'Real measurements of the current document, reported by the browser.')]));
    }
  } catch(e){}

  // --- Local benchmark
  const benchOut = h('div', { class:'panel-b' });
  function runBench(){
    benchOut.innerHTML = '';
    const results = [];
    function bench(name, iterations, fn){
      const t0 = performance.now();
      for (let i = 0; i < iterations; i++) fn(i);
      const dt = performance.now() - t0;
      results.push({ name: name, ms: dt, ops: iterations / (dt / 1000 || 1) });
    }
    bench('Array push + sort (1k)', 200, function(){
      const a = [];
      for (let i = 0; i < 1000; i++) a.push(Math.random());
      a.sort();
    });
    bench('JSON stringify/parse (2k)', 200, function(){
      const o = { a: 1, b: 'x', c: [1,2,3,4,5] };
      JSON.parse(JSON.stringify(o));
    });
    bench('Math sqrt loop (50k)', 50, function(){
      let s = 0;
      for (let i = 0; i < 50000; i++) s += Math.sqrt(i);
      return s;
    });
    bench('DOM create + remove (500)', 100, function(){
      const d = document.createDocumentFragment();
      for (let i = 0; i < 500; i++){ const el = document.createElement('div'); el.textContent = 'x'; d.append(el); }
    });
    bench('SHA-256 of 1KB (async count)', 1, function(){});

    const tbl = h('table', { class:'tbl' }, h('thead', {}, h('tr', {}, h('th', {}, 'Benchmark'), h('th', {}, 'Time'), h('th', {}, 'Ops/s'))));
    const tb = h('tbody');
    results.forEach(function(r){
      tb.append(h('tr', {}, h('td', {}, r.name), h('td', {}, r.ms.toFixed(2) + ' ms'), h('td', {}, Math.round(r.ops).toLocaleString())));
    });
    tbl.append(tb);
    benchOut.append(h('div', { class:'scroll-x' }, tbl));
    benchOut.append(h('div', { class:'hint' }, 'These are genuine measurements of this device and browser session. Values vary with thermal state, background load, and low-power mode.'));

    safePut('perfReports', { id: uid('perf'), kind:'benchmark', results: results.map(function(r){ return { name:r.name, ms:r.ms, ops:r.ops }; }), ts: now() })
      .then(refreshList);
  }
  root.append(panel('Device benchmark', [
    h('div', { class:'row' }, btn(t('Run'), { cls:'primary', onClick: runBench })),
    benchOut
  ]));

  // --- HTML static audit
  const auditOut = h('div', { class:'panel-b' });
  const auditFile = h('input', { type:'file', accept:'.html,.htm,text/html', style:{ display:'none' } });
  auditFile.addEventListener('change', function(){
    const f = auditFile.files && auditFile.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = function(){
      try {
        const html = String(rd.result);
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const scripts = doc.querySelectorAll('script');
        const externalScripts = Array.prototype.filter.call(scripts, function(s){ return s.getAttribute('src'); });
        const blockingScripts = externalScripts.filter(function(s){ return !s.hasAttribute('async') && !s.hasAttribute('defer'); });
        const imgs = doc.querySelectorAll('img');
        const noDim = Array.prototype.filter.call(imgs, function(i){ return !i.getAttribute('width') || !i.getAttribute('height'); });
        const styles = doc.querySelectorAll('link[rel="stylesheet"]');
        const totalInline = Array.prototype.reduce.call(scripts, function(a, s){ return a + (s.textContent || '').length; }, 0);
        auditOut.innerHTML = '';
        auditOut.append(h('dl', { class:'kv' },
          h('dt', {}, 'File'), h('dd', {}, f.name + ' · ' + fmtBytes(f.size)),
          h('dt', {}, 'Total HTML bytes'), h('dd', {}, fmtBytes(html.length)),
          h('dt', {}, 'Scripts'), h('dd', {}, scripts.length + ' (' + externalScripts.length + ' external, ' + blockingScripts.length + ' render-blocking)'),
          h('dt', {}, 'Inline script bytes'), h('dd', {}, fmtBytes(totalInline)),
          h('dt', {}, 'Stylesheets'), h('dd', {}, String(styles.length)),
          h('dt', {}, 'Images'), h('dd', {}, imgs.length + ' (' + noDim.length + ' without width/height)'),
          h('dt', {}, 'Images missing alt'), h('dd', {}, String(Array.prototype.filter.call(imgs, function(i){ return !i.getAttribute('alt'); }).length)),
          h('dt', {}, 'Inline style bytes'), h('dd', {}, fmtBytes(Array.prototype.reduce.call(doc.querySelectorAll('style'), function(a, s){ return a + (s.textContent || '').length; }, 0)))
        ));
        auditOut.append(h('div', { class:'hint' }, 'This is a static structural audit of the file you supplied. It is not a Lighthouse score and does not measure real-world loading.'));
      } catch(e){ toast('Audit failed: ' + e.message, 'err'); }
    };
    rd.readAsText(f);
  });
  root.append(panel('HTML static audit (local file)', [
    h('div', { class:'row' }, btn(t('Import files'), { cls:'primary', onClick: function(){ auditFile.click(); } }), auditFile),
    auditOut
  ]));

  // --- Saved reports
  const listWrap = h('div', { class:'list' });
  async function refreshList(){
    listWrap.innerHTML = '';
    let list = [];
    try { list = await dbAll('perfReports'); } catch(e){}
    list.sort(function(a,b){ return b.ts - a.ts; });
    list = list.slice(0, 20);
    if (!list.length){ listWrap.append(emptyState('Reports', 'Measurements you run are stored here.')); return; }
    list.forEach(function(r){
      listWrap.append(h('div', { class:'item', style:{ cursor:'default' } },
        h('div', { class:'body' },
          h('div', { class:'t' }, r.kind === 'url' ? ('URL · ' + truncate(r.url, 50)) : 'Device benchmark'),
          h('div', { class:'m' },
            r.kind === 'url' ? h('span', {}, 'HTTP ' + r.status) : null,
            r.kind === 'url' ? h('span', {}, r.total + ' ms') : null,
            h('span', {}, fmtDate(r.ts)))
        ),
        btn('✕', { cls:'icon ghost sm', onClick: async function(){ await dbDel('perfReports', r.id); refreshList(); } })
      ));
    });
  }
  root.append(panel('Reports', [listWrap]));
  await refreshList();

  return root;
}

/* =========================================================================
   17. MODULE 07 — ASSET INTELLIGENCE
   ========================================================================= */
async function renderAssets(params){
  const root = h('div', { class:'mod' });
  root.append(h('div', { class:'mod-head' }, h('h2', {}, t('Asset Intelligence')), h('div', { class:'sub' }, '07')));

  const objectUrls = [];
  onCleanup(function(){ objectUrls.forEach(function(u){ try { URL.revokeObjectURL(u); } catch(e){} }); objectUrls.length = 0; });

  const search = inp({ type:'search', placeholder: t('Search') + '…' });
  const catSel = selFrom([['all', t('All')],['image','Image'],['audio','Audio'],['video','Video'],['text','Text'],['archive','Archive'],['other','Other']], 'all');
  const listWrap = h('div', { class:'list' });
  const detailWrap = h('div', { class:'panel-b' });

  function categoryOf(type, name){
    type = type || '';
    if (type.indexOf('image/') === 0) return 'image';
    if (type.indexOf('audio/') === 0) return 'audio';
    if (type.indexOf('video/') === 0) return 'video';
    if (type.indexOf('text/') === 0 || /\.(txt|md|json|csv|html|css|js|xml)$/i.test(name || '')) return 'text';
    if (/zip|tar|gzip|rar|7z/.test(type) || /\.(zip|tar|gz|rar|7z)$/i.test(name || '')) return 'archive';
    return 'other';
  }

  const fileInput = h('input', { type:'file', multiple:true, style:{ display:'none' } });
  fileInput.addEventListener('change', async function(){
    const files = Array.prototype.slice.call(fileInput.files || []);
    if (!files.length) return;
    let added = 0, dupes = 0;
    for (const f of files){
      try {
        const buf = await f.arrayBuffer();
        const hash = await sha256Hex(buf);
        const existing = await dbBy('assets', 'hash', hash);
        if (existing && existing.length){ dupes++; continue; }
        const rec = {
          id: uid('asset'), name: f.name, type: f.type || 'application/octet-stream',
          size: f.size, lastModified: f.lastModified, hash: hash,
          category: categoryOf(f.type, f.name), tags: [], note:'',
          createdAt: now(), blob: new Blob([buf], { type: f.type || 'application/octet-stream' })
        };
        if (await safePut('assets', rec)) added++;
      } catch(e){
        toast('Failed to import ' + f.name + ': ' + (e.message || e), 'err');
      }
    }
    fileInput.value = '';
    toast('Imported ' + added + (dupes ? ' · ' + dupes + ' duplicates skipped' : ''), 'ok');
    logAct('asset', 'Imported ' + added + ' assets');
    refresh();
    updateStorageLine();
  });

  async function refresh(){
    listWrap.innerHTML = '';
    let list = [];
    try { list = await dbAll('assets'); } catch(e){ listWrap.append(h('div', { class:'err-box' }, String(e.message || e))); return; }
    const q = search.value.trim().toLowerCase();
    const cat = catSel.value;
    if (q) list = list.filter(function(a){ return (a.name + ' ' + (a.tags||[]).join(' ') + ' ' + (a.note||'')).toLowerCase().indexOf(q) >= 0; });
    if (cat !== 'all') list = list.filter(function(a){ return a.category === cat; });
    list.sort(function(a,b){ return b.createdAt - a.createdAt; });
    if (!list.length){ listWrap.append(emptyState(t('Import files'), 'Pick files with the native picker; they stay on this device.')); return; }

    const grid = h('div', { class:'grid' });
    for (const a of list){
      const card = h('div', { class:'item', style:{ flexDirection:'column', gap:'7px' } });
      if (a.category === 'image' && a.blob){
        const url = URL.createObjectURL(a.blob);
        objectUrls.push(url);
        card.append(h('img', { class:'thumb', src: url, alt: a.name, loading:'lazy' }));
      } else {
        card.append(h('div', { style:{ fontSize:'30px', textAlign:'center', padding:'14px 0', width:'100%' } }, a.category === 'audio' ? '♪' : a.category === 'video' ? '▶' : a.category === 'text' ? '≡' : a.category === 'archive' ? '🗜' : '◫'));
      }
      card.append(h('div', { class:'t', style:{ fontSize:'12.5px', wordBreak:'break-all' } }, truncate(a.name, 34)));
      card.append(h('div', { class:'m' }, h('span', {}, fmtBytes(a.size)), h('span', {}, a.category)));
      card.addEventListener('click', function(){ showDetail(a.id); });
      grid.append(card);
    }
    listWrap.append(grid);
  }

  async function showDetail(id){
    const a = await dbGet('assets', id);
    if (!a){ toast('Asset not found', 'err'); return; }
    detailWrap.innerHTML = '';
    const url = URL.createObjectURL(a.blob);
    objectUrls.push(url);

    detailWrap.append(h('div', { class:'t', style:{ fontWeight:'650' } }, a.name));
    if (a.category === 'image') detailWrap.append(h('img', { src: url, style:{ maxWidth:'100%', borderRadius:'10px', border:'1px solid var(--line)' } }));
    else if (a.category === 'audio') detailWrap.append(h('audio', { src: url, controls:true, style:{ width:'100%' } }));
    else if (a.category === 'video') detailWrap.append(h('video', { src: url, controls:true, style:{ width:'100%', borderRadius:'10px' } }));
    else if (a.category === 'text'){
      try {
        const txt = await a.blob.text();
        detailWrap.append(h('pre', { class:'out' }, truncate(txt, 20000)));
      } catch(e){ detailWrap.append(h('div', { class:'hint' }, 'Text preview unavailable.')); }
    }

    detailWrap.append(h('dl', { class:'kv' },
      h('dt', {}, 'Type'), h('dd', {}, a.type || '—'),
      h('dt', {}, t('Size')), h('dd', {}, fmtBytes(a.size)),
      h('dt', {}, 'Modified'), h('dd', {}, fmtDate(a.lastModified)),
      h('dt', {}, 'SHA-256'), h('dd', {}, h('span', { class:'mono' }, a.hash || '—')),
      h('dt', {}, t('Created')), h('dd', {}, fmtDate(a.createdAt))
    ));

    const tagsInp = inp({ type:'text', value: (a.tags || []).join(', '), placeholder:'tag1, tag2' });
    const noteInp = ta({ value: a.note || '', placeholder: t('Notes') });
    detailWrap.append(field(t('Tags'), tagsInp), field(t('Notes'), noteInp),
      h('div', { class:'row' },
        btn(t('Save'), { cls:'primary', onClick: async function(){
          a.tags = tagsInp.value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
          a.note = noteInp.value;
          if (await safePut('assets', a)){ toast(t('Saved'), 'ok'); refresh(); }
        } }),
        btn('⬇ ' + t('Export'), { onClick: function(){
          const u2 = URL.createObjectURL(a.blob);
          downloadBlob(a.blob, a.name);
          setTimeout(function(){ URL.revokeObjectURL(u2); }, 3000);
        } }),
        btn(t('Delete'), { cls:'danger', onClick: async function(){
          if (!(await confirmDlg(t('Delete') + ' "' + a.name + '"?'))) return;
          await dbDel('assets', a.id);
          logAct('asset', 'Deleted asset: ' + a.name);
          detailWrap.innerHTML = '';
          refresh(); updateStorageLine();
        } })
      })
    );

    if (a.category === 'image'){
      const fmt = selFrom([['image/jpeg','JPEG'],['image/webp','WebP'],['image/png','PNG']], 'image/jpeg');
      const qual = h('input', { type:'range', min:'0.1', max:'0.95', step:'0.05', value:'0.75', style:{ width:'100%' } });
      const qualLbl = h('div', { class:'hint' }, 'Quality: 0.75');
      qual.addEventListener('input', function(){ qualLbl.textContent = 'Quality: ' + qual.value; });
      detailWrap.append(panel('Compress image', [
        field('Format', fmt),
        field('Quality', qual),
        qualLbl,
        btn(t('Compress image'), { cls:'primary', onClick: async function(){
          try {
            const img = new Image();
            const u3 = URL.createObjectURL(a.blob);
            await new Promise(function(res, rej){ img.onload = res; img.onerror = function(){ rej(new Error('Image decode failed')); }; img.src = u3; });
            const c = document.createElement('canvas');
            c.width = img.naturalWidth; c.height = img.naturalHeight;
            c.getContext('2d').drawImage(img, 0, 0);
            URL.revokeObjectURL(u3);
            const type = fmt.value;
            const blob = await new Promise(function(res){ c.toBlob(res, type, Number(qual.value)); });
            if (!blob) throw new Error('Encoding failed (format may be unsupported)');
            const buf = await blob.arrayBuffer();
            const hash = await sha256Hex(buf);
            const nrec = {
              id: uid('asset'), name: a.name.replace(/\.[^.]+$/, '') + '-compressed.' + (type === 'image/jpeg' ? 'jpg' : type.split('/')[1]),
              type: type, size: blob.size, lastModified: now(), hash: hash, category:'image',
              tags: (a.tags || []).concat(['compressed']), note:'Compressed from ' + a.name,
              createdAt: now(), blob: new Blob([buf], { type: type })
            };
            if (await safePut('assets', nrec)){
              toast('Compressed: ' + fmtBytes(a.size) + ' → ' + fmtBytes(blob.size), 'ok');
              logAct('asset', 'Compressed ' + a.name);
              refresh(); updateStorageLine();
            }
          } catch(e){ toast('Compression failed: ' + (e.message || e), 'err'); }
        } })
      ]));
    }
  }

  const dupeOut = h('div', { class:'panel-b' });
  async function findDuplicates(){
    dupeOut.innerHTML = '';
    let list = [];
    try { list = await dbAll('assets'); } catch(e){}
    const byHash = {};
    list.forEach(function(a){ (byHash[a.hash] = byHash[a.hash] || []).push(a); });
    const dupes = Object.keys(byHash).filter(function(k){ return byHash[k].length > 1; });
    if (!dupes.length){ dupeOut.append(h('div', { class:'ok-box' }, 'No duplicate assets found (by SHA-256).')); return; }
    dupes.forEach(function(k){
      const group = h('div', { class:'list' });
      byHash[k].forEach(function(a){
        group.append(h('div', { class:'row tight' },
          h('div', { class:'grow', style:{ fontSize:'12.5px' } }, truncate(a.name, 40) + ' · ' + fmtBytes(a.size)),
          btn('✕', { cls:'icon ghost sm', onClick: async function(){ await dbDel('assets', a.id); findDuplicates(); refresh(); updateStorageLine(); } })
        ));
      });
      dupeOut.append(h('div', { class:'panel', style:{ padding:'10px' } }, h('div', { class:'hint mono' }, k.slice(0, 24) + '…'), group));
    });
  }

  root.append(panel(null, [
    h('div', { class:'row' },
      h('div', { class:'grow' }, search),
      h('div', { style:{ flex:'0 0 130px' } }, catSel),
      btn('＋ ' + t('Import files'), { cls:'primary', onClick: function(){ fileInput.click(); } }),
      fileInput
    ),
    h('div', { class:'row' },
      btn(t('Duplicates'), { cls:'ghost sm', onClick: findDuplicates }),
      btn(t('Refresh'), { cls:'ghost sm', onClick: refresh })
    ),
    dupeOut
  ]));

  root.append(panel('Assets', [listWrap]));
  root.append(h('section', { class:'panel' }, h('div', { class:'panel-h' }, h('h3', {}, 'Detail')), detailWrap));

  search.addEventListener('input', debounce(refresh, 180));
  catSel.addEventListener('change', refresh);

  await refresh();
  if (params && params.open) showDetail(params.open);
  updateStorageLine();
  return root;
}

/* =========================================================================
   18. MODULE 08 — COMPONENT ENGINEERING LAB
   ========================================================================= */
const COMPONENT_TEMPLATE = {
  html: '<button class="demo-btn">Click me</button>',
  css: '.demo-btn{padding:10px 16px;border-radius:10px;border:none;background:#2ea8ff;color:#fff;font:inherit;cursor:pointer}\n.demo-btn:active{transform:scale(.97)}',
  js: 'document.querySelector(".demo-btn").addEventListener("click", function(){\n  this.textContent = "Clicked " + new Date().toLocaleTimeString();\n});'
};

async function renderComponents(params){
  const root = h('div', { class:'mod' });
  root.append(h('div', { class:'mod-head' }, h('h2', {}, t('Component Engineering Lab')), h('div', { class:'sub' }, '08')));

  const search = inp({ type:'search', placeholder: t('Search') + '…' });
  const listWrap = h('div', { class:'list' });

  async function refresh(){
    listWrap.innerHTML = '';
    let list = [];
    try { list = await dbAll('components'); } catch(e){}
    const q = search.value.trim().toLowerCase();
    if (q) list = list.filter(function(c){
      return ((c.name || '') + ' ' + (c.description || '') + ' ' + (c.category || '') + ' ' + ((c.tags||[]).join(' '))).toLowerCase().indexOf(q) >= 0;
    });
    list.sort(function(a,b){ return (b.updatedAt||0) - (a.updatedAt||0); });
    if (!list.length){ listWrap.append(emptyState('Components', 'Reusable HTML/CSS/JS components you save appear here.')); return; }
    list.forEach(function(c){
      listWrap.append(h('div', { class:'item', onclick: function(){ openEditor(c.id); } },
        h('div', { class:'body' },
          h('div', { class:'t' }, c.name),
          c.description ? h('div', { class:'s' }, truncate(c.description, 120)) : null,
          h('div', { class:'m' },
            c.category ? pill(c.category, 'pu') : null,
            (c.tags || []).map(function(tg){ return pill(tg); }),
            h('span', {}, 'v' + (c.version || 1)),
            h('span', {}, fmtDate(c.updatedAt))
          )
        )
      ));
    });
  }

  async function openEditor(id){
    root.innerHTML = '';
    let comp;
    if (id){
      comp = await dbGet('components', id);
      if (!comp){ toast('Component not found', 'err'); navigate('components'); return; }
    } else {
      comp = { id: uid('cmp'), name:'New component', description:'', category:'', tags:[], version:1,
        html: COMPONENT_TEMPLATE.html, css: COMPONENT_TEMPLATE.css, js: COMPONENT_TEMPLATE.js, createdAt: now(), updatedAt: now() };
    }

    root.append(h('div', { class:'mod-head' },
      btn('‹ ' + t('Back'), { cls:'ghost', onClick: function(){ navigate('components'); } }),
      h('h2', { class:'grow' }, comp.name),
      pill('v' + (comp.version || 1))
    ));

    const nameInp = inp({ type:'text', value: comp.name });
    const descInp = inp({ type:'text', value: comp.description || '', placeholder: t('Description') });
    const catInp = inp({ type:'text', value: comp.category || '', placeholder: t('Category') });
    const tagsInp = inp({ type:'text', value: (comp.tags || []).join(', '), placeholder:'tag1, tag2' });
    const htmlArea = ta({ value: comp.html || '' });
    const cssArea = ta({ value: comp.css || '' });
    const jsArea = ta({ value: comp.js || '' });
    const iframe = h('iframe', { class:'preview', sandbox:'allow-scripts', title:'Component preview' });

    function srcdoc(){
      return '<!DOCTYPE html><html><head><meta charset="utf-8"><style>' + (cssArea.value || '') + '</style></head><body>' +
        (htmlArea.value || '') + '<scr' + 'ipt>' + (jsArea.value || '') + '</scr' + 'ipt></body></html>';
    }
    function updatePreview(){ iframe.setAttribute('srcdoc', srcdoc()); }

    let previewTimer = null;
    [htmlArea, cssArea, jsArea].forEach(function(a){
      a.addEventListener('input', function(){
        clearTimeout(previewTimer);
        previewTimer = setTimeout(updatePreview, 500);
      });
    });
    updatePreview();

    const tabs = h('div', { class:'tabs' });
    const panes = { html: htmlArea, css: cssArea, js: jsArea };
    function selectTab(k){
      Object.keys(panes).forEach(function(x){ panes[x].style.display = x === k ? '' : 'none'; });
      $$('.tab', tabs).forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab') === k); });
    }
    [['html','HTML'],['css','CSS'],['js','JS']].forEach(function(p){
      tabs.append(h('button', { class:'tab', 'data-tab': p[0], onclick: function(){ selectTab(p[0]); } }, p[1]));
    });
    selectTab('html');

    root.append(panel(null, [
      field(t('Name'), nameInp),
      field(t('Description'), descInp),
      h('div', { class:'row' },
        h('div', { class:'grow' }, field(t('Category'), catInp)),
        h('div', { class:'grow' }, field(t('Tags'), tagsInp))
      ),
      h('div', { class:'row' },
        btn(t('Save version'), { cls:'primary', onClick: async function(){
          const prev = { html: comp.html, css: comp.css, js: comp.js, version: comp.version || 1 };
          await safePut('componentVersions', { id: uid('cv'), componentId: comp.id, version: prev.version, html: prev.html, css: prev.css, js: prev.js, ts: now() });
          comp.name = nameInp.value.trim() || 'Component';
          comp.description = descInp.value;
          comp.category = catInp.value;
          comp.tags = tagsInp.value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
          comp.html = htmlArea.value; comp.css = cssArea.value; comp.js = jsArea.value;
          comp.version = (comp.version || 1) + 1;
          comp.updatedAt = now();
          if (await safePut('components', JSON.parse(JSON.stringify(comp)))){
            toast(t('Saved') + ' — v' + comp.version, 'ok');
            logAct('component', 'Saved component: ' + comp.name + ' v' + comp.version);
          }
        } }),
        btn(t('Export'), { onClick: function(){
          downloadBlob(new Blob([JSON.stringify(comp, null, 2)], { type:'application/json' }), 'component-' + comp.name.replace(/[^\w\-]+/g,'_') + '.json');
        } }),
        btn(t('Delete'), { cls:'danger', onClick: async function(){
          if (!(await confirmDlg(t('Delete') + ' "' + comp.name + '"?'))) return;
          await dbDel('components', comp.id);
          const vers = await dbBy('componentVersions', 'componentId', comp.id);
          for (const v of vers) await dbDel('componentVersions', v.id);
          logAct('component', 'Deleted component: ' + comp.name);
          navigate('components');
        } })
      ),
      h('div', { class:'info-box' }, LANG==='fa'
        ? 'پیش‌نمایش در iframe ایزوله با sandbox اجرا می‌شود و به‌همین‌دلیل کد وارد‌شده به حافظه برنامه دسترسی ندارد.'
        : 'The preview runs inside a sandboxed iframe without same-origin access, so imported code cannot touch this application’s data.')
    ]));

    root.append(panel(t('Preview'), [iframe, btn(t('Refresh'), { cls:'ghost sm', onClick: updatePreview })]));
    root.append(panel('Code', [tabs, htmlArea, cssArea, jsArea]));

    // versions
    const verWrap = h('div', { class:'list' });
    async function refreshVersions(){
      verWrap.innerHTML = '';
      let vers = [];
      try { vers = await dbBy('componentVersions', 'componentId', comp.id); } catch(e){}
      vers.sort(function(a,b){ return b.ts - a.ts; });
      if (!vers.length){ verWrap.append(h('div', { class:'hint' }, 'No saved versions yet. Saving a version archives the current code before overwriting.')); return; }
      vers.forEach(function(v){
        verWrap.append(h('div', { class:'row tight' },
          h('div', { class:'grow' }, 'v' + v.version + ' · ' + fmtDate(v.ts)),
          btn(t('Open'), { cls:'ghost sm', onClick: function(){
            htmlArea.value = v.html || ''; cssArea.value = v.css || ''; jsArea.value = v.js || '';
            updatePreview(); toast('Loaded v' + v.version + ' into the editor (not saved yet)');
          } }),
          btn('✕', { cls:'icon ghost sm', onClick: async function(){ await dbDel('componentVersions', v.id); refreshVersions(); } })
        ));
      });
    }
    root.append(panel(t('Versions'), [verWrap]));
    await refreshVersions();
  }

  root.append(panel(null, [
    h('div', { class:'row' },
      h('div', { class:'grow' }, search),
      btn('＋ ' + t('New component'), { cls:'primary', onClick: function(){ openEditor(null); } }),
      btn(t('Import'), { onClick: function(){

function extractReadableText(html, baseUrl){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  Array.prototype.slice.call(doc.querySelectorAll('script,style,noscript,svg,iframe')).forEach(function(el){ el.remove(); });
  const title = doc.querySelector('title') ? doc.querySelector('title').textContent.trim() : '';
  const metaDesc = doc.querySelector('meta[name="description"]');
  const body = doc.body ? doc.body.textContent : '';
  const text = body.replace(/\s+\n/g, '\n').replace(/[ \t]{2,}/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  return { title: title, description: metaDesc ? metaDesc.getAttribute('content') : '', text: text.slice(0, 200000), truncated: text.length > 200000 };
}

/* =========================================================================
   20. BACKUP SYSTEM — ZIP writer/reader, checksums, encryption
   ========================================================================= */
const CRC_TABLE = (function(){
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[n] = c >>> 0;
  }
  return table;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function dosDateTime(d){
  const time = ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5) | ((Math.floor(d.getSeconds() / 2)) & 31);
  const date = (((d.getFullYear() - 1980) & 127) << 9) | (((d.getMonth() + 1) & 15) << 5) | (d.getDate() & 31);
  return { time: time, date: date };
}
function zipCreate(entries){
  const enc = new TextEncoder();
  const dt = dosDateTime(new Date());
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  entries.forEach(function(e){
    const nameBytes = enc.encode(e.name);
    const data = e.data instanceof Uint8Array ? e.data : new Uint8Array(e.data);
    const crc = crc32(data);

    const lh = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, dt.time, true);
    lv.setUint16(12, dt.date, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true);
    lv.setUint32(22, data.length, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);

    localParts.push(lh, data);

    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, dt.time, true);
    cv.setUint16(14, dt.date, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    centralParts.push(cd);

    offset += lh.length + data.length;
  });

  const cdSize = centralParts.reduce(function(a, p){ return a + p.length; }, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);

  const all = localParts.concat(centralParts, [eocd]);
  const total = all.reduce(function(a, p){ return a + p.length; }, 0);
  const out = new Uint8Array(total);
  let p = 0;
  all.forEach(function(chunk){ out.set(chunk, p); p += chunk.length; });
  return out;
}

async function inflateRaw(u8){
  if (typeof DecompressionStream === 'undefined')
    throw new Error('This browser cannot decompress DEFLATE entries (DecompressionStream is unavailable).');
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function zipRead(u8){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  const minPos = Math.max(0, u8.length - 66000);
  for (let i = u8.length - 22; i >= minPos; i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Not a ZIP archive (end-of-central-directory record not found).');
  const count = dv.getUint16(eocd + 10, true);
  const cdOffset = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder();
  const out = [];
  let p = cdOffset;
  for (let i = 0; i < count; i++){
    if (p + 46 > u8.length) throw new Error('Corrupt central directory (truncated).');
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('Corrupt central directory entry at ' + p);
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const uncompSize = dv.getUint32(p + 24, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOffset = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nameLen));
    if (dv.getUint32(localOffset, true) !== 0x04034b50) throw new Error('Corrupt local header for ' + name);
    const lNameLen = dv.getUint16(localOffset + 26, true);
    const lExtraLen = dv.getUint16(localOffset + 28, true);
    const dataStart = localOffset + 30 + lNameLen + lExtraLen;
    const raw = u8.subarray(dataStart, dataStart + compSize);
    let data;
    if (method === 0) data = raw.slice();
    else if (method === 8) data = await inflateRaw(raw);
    else throw new Error('Unsupported compression method ' + method + ' for ' + name);
    out.push({ name: name, data: data, size: uncompSize });
    p += 46 + nameLen + extraLen + commentLen;
  }
  return out;
}

/* Crypto helpers ---------------------------------------------------------- */
function cryptoAvailable(){
  return typeof crypto !== 'undefined' && crypto.subtle && typeof crypto.subtle.digest === 'function';
}
async function sha256Hex(buf){
  if (!cryptoAvailable()) throw new Error('Web Crypto (crypto.subtle) is unavailable. Serve this file over HTTPS to enable hashing.');
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return Array.prototype.map.call(new Uint8Array(digest), function(b){ return b.toString(16).padStart(2, '0'); }).join('');
}
async function deriveKey(password, salt, iterations){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), { name:'PBKDF2' }, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: salt, iterations: iterations, hash:'SHA-256' },
    baseKey, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
  );
}
function concatBytes(){
  let total = 0;
  for (let i = 0; i < arguments.length; i++) total += arguments[i].length;
  const out = new Uint8Array(total);
  let p = 0;
  for (let i = 0; i < arguments.length; i++){ out.set(arguments[i], p); p += arguments[i].length; }
  return out;
}

/* Backup builder ---------------------------------------------------------- */
const APP_VERSION = '1.0.0';
const BACKUP_FORMAT = 1;

async function collectBackup(opts){
  opts = opts || {};
  const report = { entries: [], counts: {}, skipped: [], warnings: [] };
  const stores = opts.stores || STORE_NAMES;
  const includeAssets = stores.indexOf('assets') >= 0;
  const filterProject = opts.projectId || null;

  for (const store of stores){
    let records = [];
    try { records = await dbAll(store); } catch(e){ report.warnings.push('Could not read store "' + store + '": ' + (e.message || e)); continue; }

    if (filterProject){
      if (store === 'specs') records = records.filter(function(r){ return r.projectId === filterProject; });
      else if (store === 'projects') records = records.filter(function(r){ return r.id === filterProject; });
      else if (store === 'tasks') records = records.filter(function(r){ return r.projectId === filterProject; });
      else if (store !== 'settings') records = [];
    }

    if (store === 'assets'){
      const meta = [];
      for (const a of records){
        const copy = {};
        Object.keys(a).forEach(function(k){ if (k !== 'blob') copy[k] = a[k]; });
        if (a.blob){
          const fname = 'assets/' + a.id + '__' + String(a.name || 'file').replace(/[^\w.\-]+/g, '_');
          copy.file = fname;
          const buf = new Uint8Array(await a.blob.arrayBuffer());
          report.entries.push({ name: fname, data: buf });
          report.counts[fname] = buf.length;
        } else {
          copy.file = null;
          report.warnings.push('Asset "' + (a.name || a.id) + '" has no stored binary; only metadata will be exported.');
        }
        meta.push(copy);
      }
      const json = new TextEncoder().encode(JSON.stringify(meta, null, 2));
      report.entries.push({ name: 'database/assets.json', data: json });
      report.counts[store] = records.length;
      continue;
    }

    const json = new TextEncoder().encode(JSON.stringify(records, null, 2));
    report.entries.push({ name: 'database/' + store + '.json', data: json });
    report.counts[store] = records.length;
  }

  return report;
}

async function buildBackupBlob(opts){
  const report = await collectBackup(opts);
  const checksums = {};
  if (cryptoAvailable()){
    for (const e of report.entries){
      try { checksums[e.name] = await sha256Hex(e.data); } catch(err){ report.warnings.push('Checksum failed for ' + e.name); }
    }
  } else {
    report.warnings.push('Web Crypto is unavailable — checksums were not generated.');
  }

  const manifest = {
    app: 'NONONICK DIGITAL OS',
    appVersion: APP_VERSION,
    backupFormatVersion: BACKUP_FORMAT,
    createdAt: new Date().toISOString(),
    scope: opts.projectId ? ('project:' + opts.projectId) : 'full',
    stores: opts.stores || STORE_NAMES,
    recordCounts: report.counts,
    encrypted: false,
    compression: 'none (stored)',
    integrity: { algorithm: cryptoAvailable() ? 'SHA-256' : 'none', file: 'checksums.json' },
    warnings: report.warnings
  };

  const enc = new TextEncoder();
  const entries = report.entries.concat([
    { name: 'manifest.json', data: enc.encode(JSON.stringify(manifest, null, 2)) },
    { name: 'checksums.json', data: enc.encode(JSON.stringify(checksums, null, 2)) }
  ]);

  const zipBytes = zipCreate(entries);
  return { zipBytes: zipBytes, manifest: manifest, warnings: report.warnings };
}

async function encryptBackup(zipBytes, password){
  if (!cryptoAvailable()) throw new Error('Web Crypto is unavailable; encrypted backups cannot be created in this context.');
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const iterations = 250000;
  const key = await deriveKey(password, salt, iterations);
  const cipher = await crypto.subtle.encrypt({ name:'AES-GCM', iv: iv }, key, zipBytes);
  const header = { v:1, alg:'AES-GCM-256', kdf:'PBKDF2-SHA256', iterations: iterations, salt: btoa(String.fromCharCode.apply(null, salt)), iv: btoa(String.fromCharCode.apply(null, iv)) };
  const headerBytes = new TextEncoder().encode(JSON.stringify(header));
  const magic = new TextEncoder().encode('NNBX');
  const lenBuf = new Uint8Array(4);
  new DataView(lenBuf.buffer).setUint32(0, headerBytes.length, true);
  return concatBytes(magic, lenBuf, headerBytes, new Uint8Array(cipher));
}

async function decryptBackup(bytes, password){
  const magic = new TextDecoder().decode(bytes.subarray(0, 4));
  if (magic !== 'NNBX') throw new Error('Not an encrypted NONONICK backup.');
  const headerLen = new DataView(bytes.buffer, bytes.byteOffset + 4, 4).getUint32(0, true);
  const header = JSON.parse(new TextDecoder().decode(bytes.subarray(8, 8 + headerLen)));
  const cipherBytes = bytes.subarray(8 + headerLen);
  const salt = Uint8Array.from(atob(header.salt), function(c){ return c.charCodeAt(0); });
  const iv = Uint8Array.from(atob(header.iv), function(c){ return c.charCodeAt(0); });
  const key = await deriveKey(password, salt, header.iterations);
  try {
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: iv }, key, cipherBytes);
    return new Uint8Array(plain);
  } catch(e){
    throw new Error('Decryption failed — wrong password or corrupted file.');
  }
}

/* Backup import ----------------------------------------------------------- */
async function analyzeBackup(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  const magic = new TextDecoder().decode(buf.subarray(0, 4));
  let zipBytes = buf;
  let encrypted = false;

  if (magic === 'NNBX'){
    encrypted = true;
    const pw = await openModal({
      title: 'Encrypted backup',
      content: [
        h('div', { class:'info-box' }, 'This backup is password-protected. The password is never stored anywhere — if it is lost, the backup cannot be recovered.'),
        field('Password', inp({ type:'password', id:'bkPass', autocomplete:'off' }))
      ],
      actions: [
        { label: t('Cancel'), value: null, cls:'ghost' },
        { label: t('Continue'), value: 'ok', cls:'primary' }
      ]
    });
    if (!pw) return null;
    const pwInput = $('#modalRoot input') || document.querySelector('input[type="password"]');
    const password = window.__bkPass || '';
    // Read the value before the modal closed: fallback approach
    zipBytes = null;
    return { needsPassword: true, bytes: buf };
  }

  const entries = await zipRead(zipBytes);
  return { encrypted: false, entries: entries, bytes: buf };
}

/* Since the modal closes before we can read the field, we capture it with a
   dedicated promise-based password dialog. */
function askPassword(title, message){
  return new Promise(function(resolve){
    const input = inp({ type:'password', autocomplete:'off' });
    openModal({
      title: title,
      content: [ h('div', { class:'info-box' }, message), field('Password', input) ],
      actions: [
        { label: t('Cancel'), value: null, cls:'ghost' },
        { label: t('Continue'), value: 'ok', cls:'primary', onClick: function(){ window.__tmpPass = input.value; } }
      ]
    }).then(function(r){
      const v = r ? (window.__tmpPass || '') : null;
      window.__tmpPass = '';
      resolve(v);
    });
  });
}

async function parseBackupFile(file, password){
  const buf = new Uint8Array(await file.arrayBuffer());
  const magic = new TextDecoder().decode(buf.subarray(0, 4));
  if (magic === 'NNBX'){
    if (!password) return { needsPassword: true, bytes: buf };
    const zipBytes = await decryptBackup(buf, password);
    const entries = await zipRead(zipBytes);
    return { encrypted: true, entries: entries };
  }
  const entries = await zipRead(buf);
  return { encrypted: false, entries: entries };
}

function entriesToMap(entries){
  const m = {};
  entries.forEach(function(e){ m[e.name] = e.data; });
  return m;
}

async function verifyEntries(entries){
  const map = entriesToMap(entries);
  const result = { ok: true, checked: 0, failed: [], missing: [], manifest: null };
  const dec = new TextDecoder();
  if (!map['manifest.json']){ result.ok = false; result.missing.push('manifest.json'); return result; }
  try { result.manifest = JSON.parse(dec.decode(map['manifest.json'])); } catch(e){ result.ok = false; result.missing.push('manifest.json (unreadable)'); return result; }
  if (!map['checksums.json']){
    result.ok = false; result.missing.push('checksums.json'); return result;
  }
  let checksums = {};
  try { checksums = JSON.parse(dec.decode(map['checksums.json'])); } catch(e){}
  if (!cryptoAvailable()){
    result.ok = false;
    result.missing.push('Web Crypto unavailable — integrity cannot be verified in this context');
    return result;
  }
  const names = Object.keys(checksums);
  for (const name of names){
    if (!map[name]){ result.failed.push(name + ' (missing from archive)'); result.ok = false; continue; }
    try {
      const h = await sha256Hex(map[name]);
      result.checked++;
      if (h !== checksums[name]){ result.ok = false; result.failed.push(name + ' (hash mismatch)'); }
    } catch(e){ result.ok = false; result.failed.push(name + ' (' + e.message + ')'); }
  }
  return result;
}

  const encrypt = await openModal({
    title: 'Encryption',
    content: [ h('div', { class:'info-box' }, 'Optionally protect the backup with a password. Encryption uses AES-GCM-256 with PBKDF2-SHA256 (250,000 iterations) and a fresh random salt and nonce. Losing the password makes the backup unrecoverable.') ],
    actions: [
      { label: 'Plain ZIP', value: 'plain', cls:'ghost' },
      { label: 'Encrypted (.nnbx)', value:'enc', cls:'primary' }

  });

async function importBackupFlow(){
  const fi = h('input', { type:'file', accept:'.zip,.nnbx,.json,application/zip,application/octet-stream', style:{ display:'none' } });
  document.body.appendChild(fi);
  fi.addEventListener('change', async function(){
    const f = fi.files && fi.files[0];
    fi.remove();
    if (!f) return;

    if (f.size > 400 * 1024 * 1024){
      toast('File is very large (' + fmtBytes(f.size) + '). Import may exhaust memory.', 'err');
    }

    let parsed;
    try {
      parsed = await parseBackupFile(f, null);
    } catch(e){
      toast('Could not read backup: ' + (e.message || e), 'err'); return;
    }

    let password = null;
    if (parsed.needsPassword){
      password = await askPassword('Encrypted backup', 'Enter the password for this backup. It is required to decrypt the archive; it is not stored anywhere.');
      if (!password) return;
      try { parsed = await parseBackupFile(f, password); }
      catch(e){ toast('Decryption failed: ' + (e.message || e), 'err'); return; }
    }

    // Verify
    let verification;
    try { verification = await verifyEntries(parsed.entries); }
    catch(e){ toast('Verification error: ' + (e.message || e), 'err'); return; }

    const map = entriesToMap(parsed.entries);
    const dec = new TextDecoder();
    const manifest = verification.manifest || {};
    const dbFiles = Object.keys(map).filter(function(n){ return n.indexOf('database/') === 0 && n.slice(-5) === '.json'; });

    const preview = h('div', { class:'list' });
    preview.append(h('dl', { class:'kv' },
      h('dt', {}, 'App'), h('dd', {}, manifest.app || '—'),
      h('dt', {}, 'App version'), h('dd', {}, manifest.appVersion || '—'),
      h('dt', {}, 'Format'), h('dd', {}, String(manifest.backupFormatVersion || '?')),
      h('dt', {}, 'Created'), h('dd', {}, manifest.createdAt || '—'),
      h('dt', {}, 'Scope'), h('dd', {}, manifest.scope || 'full'),
      h('dt', {}, 'Encrypted'), h('dd', {}, parsed.encrypted ? t('Yes') : t('No')),
      h('dt', {}, 'Integrity'), h('dd', {}, verification.ok ? ('✓ ' + verification.checked + ' files verified') : '✗ issues found')
    ));

    const conflictInfo = [];
    for (const name of dbFiles){
      const store = name.replace('database/', '').replace('.json', '');
      if (!STORES[store]){ conflictInfo.push(store + ': unknown store (skipped)'); continue; }
      let records = [];
      try { records = JSON.parse(dec.decode(map[name])); } catch(e){ conflictInfo.push(store + ': unreadable JSON'); continue; }
      let existing = [];
      try { existing = await dbAll(store); } catch(e){}
      const existingIds = {};
      existing.forEach(function(r){ existingIds[r[STORES[store].kp]] = true; });
      const incoming = records.length;
      const conflicts = records.filter(function(r){ return existingIds[r[STORES[store].kp]]; }).length;
      preview.append(h('div', { class:'row' }, h('div', { class:'grow' }, store), h('span', { class:'hint' }, incoming + ' records · ' + conflicts + ' already exist')));
    }

    const assetFiles = Object.keys(map).filter(function(n){ return n.indexOf('assets/') === 0 && n !== 'assets/index.json'; });
    if (assetFiles.length) preview.append(h('div', { class:'row' }, h('div', { class:'grow' }, 'binary assets'), h('span', { class:'hint' }, assetFiles.length + ' files')));

    if (!verification.ok){
      preview.append(h('div', { class:'err-box' }, 'Integrity problems: ' + (verification.failed.concat(verification.missing).join('; ') || 'unknown')));
    }
    (manifest.warnings || []).forEach(function(w){ preview.append(h('div', { class:'warn-box' }, w)); });

    const mode = await openModal({
      title: t('Import Backup'),
      wide: true,
      content: [
        preview,
        h('div', { class:'warn-box' }, LANG==='fa'
          ? 'حالت «ادغام» رکوردهای موجود با شناسه یکسان را به‌روزرسانی می‌کند. حالت «جایگزینی کامل» ابتدا همه داده‌های محلی را پاک می‌کند.'
          : 'Merge updates existing records that share an ID. Full replace clears all local data first — this cannot be undone.'),
        h('div', { class:'info-box' }, 'Verification: ' + (verification.ok ? 'all checksums match.' : 'problems detected — review before continuing.'))
      ],
      actions: [
        { label: t('Cancel'), value: null, cls:'ghost' },
        { label: 'Merge', value:'merge', cls:'primary' },
        { label: 'Full replace', value:'replace', cls:'danger' }
      ]
    });
    if (!mode) return;

    if (mode === 'replace'){
      const ok = await confirmDlg('Replace ALL local data with the contents of this backup? Existing records will be permanently deleted.', { okLabel:'Replace everything', danger:true });
      if (!ok) return;
    }

    await progressModal('Restoring', async function(api){
      const storesToRestore = new Set();
      dbFiles.forEach(function(n){ storesToRestore.add(n.replace('database/','').replace('.json','')); });
      if (assetFiles.length || map['database/assets.json']) storesToRestore.add('assets');

      if (mode === 'replace'){
        for (const s of STORE_NAMES){
          if (s === 'settings' && !storesToRestore.has('settings')) continue;
          if (!storesToRestore.has(s)) continue;
          try { await dbClear(s); api.log('cleared ' + s); } catch(e){ api.log('⚠ could not clear ' + s); }
        }
      }

      let totalWritten = 0;
      for (const name of dbFiles){
        const store = name.replace('database/','').replace('.json','');
        if (!STORES[store]){ api.log('⚠ skipped unknown store: ' + store); continue; }
        let records;
        try { records = JSON.parse(dec.decode(map[name])); } catch(e){ api.log('✗ unreadable: ' + name); continue; }
        if (!Array.isArray(records)){ api.log('✗ not an array: ' + name); continue; }
        let n = 0;
        for (const r of records){
          try { await dbPut(store, r); n++; } catch(e){ api.log('✗ record failed in ' + store + ': ' + (e.message || e)); }
        }
        totalWritten += n;
        api.log('✓ ' + store + ': ' + n + ' records');
      }

      if (map['database/assets.json']){
        let metas = [];
        try { metas = JSON.parse(dec.decode(map['database/assets.json'])); } catch(e){}
        let restored = 0, missing = 0;
        for (const meta of metas){
          const file = meta.file;
          if (file && map[file]){
            const blob = new Blob([map[file]], { type: meta.type || 'application/octet-stream' });
            const rec = {};
            Object.keys(meta).forEach(function(k){ if (k !== 'file') rec[k] = meta[k]; });
            rec.blob = blob;
            try { await dbPut('assets', rec); restored++; } catch(e){ api.log('✗ asset failed: ' + (meta.name || meta.id)); }
          } else {
            missing++;
            const rec = {};
            Object.keys(meta).forEach(function(k){ if (k !== 'file') rec[k] = meta[k]; });
            if (rec.blob === undefined){
              try { await dbPut('assets', rec); } catch(e){}
            }
          }
        }
        api.log('✓ assets: ' + restored + ' binary files restored' + (missing ? ', ' + missing + ' without binary data' : ''));
        totalWritten += restored;
      }

      api.log('Total records written: ' + totalWritten);
      api.log('✓ Restore complete');
      logAct('backup', 'Imported backup (' + mode + ')');
      const hist = LS.get('backupHistory', []);
      hist.unshift({ ts: now(), kind:'import', mode: mode, file: f.name, size: f.size });
      LS.set('backupHistory', hist.slice(0, 25));
      updateStorageLine();
    });
  });
  fi.click();
}
