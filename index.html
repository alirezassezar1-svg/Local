        const ok = await confirmDlg('Delete every record in every store? This cannot be undone.', { okLabel:'Delete everything' });
        if (!ok) return;
        for (const s of STORE_NAMES){ try { await dbClear(s); } catch(e){} }
        LS.del('backupHistory');
        toast('All local data cleared', 'ok');
        logAct('system', 'Cleared all local data');
        navigate('dashboard');
      } })
    )
  ]));

  /* PWA notes */
  root.append(panel('Installation & offline', [
    h('div', { class:'info-box' },
      (LANG==='fa'
        ? 'برای نصب به‌عنوان PWA و کش آفلاین، فایل باید از یک مبدأ HTTPS سرو شود و یک فایل service-worker.js جداگانه در همان مبدأ موجود باشد. یک فایل HTML تنها نمی‌تواند Service Worker ثبت کند.'
        : 'To install as a PWA and cache offline, this file must be served from an HTTPS origin together with a separate service-worker.js in the same origin. A single local HTML file cannot register a Service Worker.')),
    h('div', { class:'hint' },
      (LANG==='fa'
        ? 'بدون HTTPS، برنامه همچنان کامل کار می‌کند، اما نصب و کش آفلاین در دسترس نیست.'
        : 'Without HTTPS the app still works fully, but installation and offline caching are unavailable.'))
  ]));

  if (params && params.action === 'exportAll') setTimeout(exportAllFlow, 300);
  if (params && params.action === 'importBackup') setTimeout(importBackupFlow, 300);
  if (params && params.action === 'clear') setTimeout(function(){ confirmInp.focus(); }, 300);

  return root;
}

async function verifyBackupFlow(){
  const fi = h('input', { type:'file', accept:'.zip,.nnbx', style:{ display:'none' } });
  document.body.appendChild(fi);
  fi.addEventListener('change', async function(){
    const f = fi.files && fi.files[0]; fi.remove();
    if (!f) return;
    let parsed;
    try { parsed = await parseBackupFile(f, null); }
    catch(e){ toast('Read failed: ' + (e.message || e), 'err'); return; }
    let password = null;
    if (parsed.needsPassword){
      password = await askPassword('Encrypted backup', 'Enter the password to verify this backup.');
      if (!password) return;
      try { parsed = await parseBackupFile(f, password); }
      catch(e){ toast('Decryption failed: ' + (e.message || e), 'err'); return; }
    }
    const v = await verifyEntries(parsed.entries);
    openModal({
      title: t('Verify Backup'),
      content: [
        h('div', { class: v.ok ? 'ok-box' : 'err-box' }, v.ok ? ('✓ Integrity verified — ' + v.checked + ' files match their checksums.') : ('✗ Problems detected.')),
        v.manifest ? h('pre', { class:'out' }, JSON.stringify(v.manifest, null, 2)) : null,
        v.failed.length ? h('div', { class:'err-box' }, 'Failed: ' + v.failed.join(', ')) : null,
        v.missing.length ? h('div', { class:'warn-box' }, 'Missing: ' + v.missing.join(', ')) : null
      ],
      actions: [{ label: t('Close'), value:null, cls:'primary' }]
    });
  });
  fi.click();
}

async function exportModuleFlow(){
  const stores = await pickStoresDialog(t('Export Selected Module'));
  if (!stores || !stores.length) return;
  await progressModal('Export module', async function(api){
    api.log('Collecting: ' + stores.join(', '));
    const built = await buildBackupBlob({ stores: stores });
    const stamp = new Date().toISOString().replace(/[:.]/g, '-');
    downloadBlob(new Blob([built.zipBytes], { type:'application/zip' }), 'NONONICK-MODULE-' + stamp + '.zip');
    api.log('✓ ' + fmtBytes(built.zipBytes.length) + ' ZIP downloaded');
    built.warnings.forEach(function(w){ api.log('⚠ ' + w); });
  });
}

async function exportProjectFlow(){
  const projects = await dbAll('projects');
  if (!projects.length){ toast('No projects to export', 'err'); return; }
  const sel = selFrom(projects.map(function(p){ return [p.id, p.name]; }), projects[0].id);
  const ok = await openModal({
    title: t('Export Selected Project'),
    content: [ field(t('New Project'), sel), h('div', { class:'hint' }, 'Includes the project record, its specifications and its tasks.') ],
    actions: [{ label: t('Cancel'), value:null, cls:'ghost' }, { label: t('Export'), value:'ok', cls:'primary' }]
  });
  if (!ok) return;
  const pid = sel.value;
  await progressModal('Export project', async function(api){
    const built = await buildBackupBlob({ projectId: pid, stores: ['projects','specs','tasks'] });
    const proj = projects.find(function(p){ return p.id === pid; });
    downloadBlob(new Blob([built.zipBytes], { type:'application/zip' }), 'NONONICK-PROJECT-' + (proj ? proj.name.replace(/[^\w\-]+/g,'_') : 'project') + '.zip');
    api.log('✓ Project exported');
  });
}

   22. LANGUAGE SWITCH
   ========================================================================= */
function setLanguage(lang){
  LS.set('lang', lang);
  applyLang(lang);
  buildNav();
  updateNavActive();
  navigate(state.route, state.params);
}

/* =========================================================================
   23. BOOT
   ========================================================================= */
function fatalScreen(err){
  const view = $('#view');
  view.innerHTML = '';
  view.append(h('div', { class:'mod' },
    h('div', { class:'err-box' },
      h('b', {}, 'Storage unavailable'),
      h('div', { style:{ marginTop:'8px' } }, String((err && err.message) || err))
    ),
    h('div', { class:'warn-box' },
      'NONONICK DIGITAL OS stores all data in IndexedDB. This browser context did not allow the database to be opened. ' +
      'Common causes: private browsing windows that block storage, storage disabled by policy, or opening the file in a context where IndexedDB is restricted. ' +
      'Serving the file over HTTPS (or a localhost origin) resolves most cases. The interface still loads, but no data can be saved or read.')
  ));
}

async function boot(){
  state.theme = LS.get('theme', 'dark');
  applyTheme(state.theme);
  const savedLang = LS.get('lang', (navigator.language || 'en').slice(0,2) === 'fa' ? 'fa' : 'en');
  applyLang(savedLang);

  buildNav();

  // Shell events
  $('#menuBtn').addEventListener('click', function(){
    const s = $('#sidebar');
    if (s.classList.contains('open')) closeSidebar(); else openSidebar();
  });
  $('#scrim').addEventListener('click', closeSidebar);
  $('#paletteBtn').addEventListener('click', openPalette);
  $('#themeBtn').addEventListener('click', function(){ applyTheme(state.theme === 'dark' ? 'light' : 'dark'); });
  $('#langBtn').addEventListener('click', function(){ setLanguage(LANG === 'en' ? 'fa' : 'en'); });
  $('#palette').addEventListener('click', function(e){ if (e.target.id === 'palette') closePalette(); });

  const palInput = $('#palInput');
  palInput.addEventListener('input', debounce(function(){ paletteSearch(palInput.value).then(function(items){ palIndex = 0; renderPalette(items); }); }, 130));
  palInput.addEventListener('keydown', function(e){
    if (e.key === 'ArrowDown'){ e.preventDefault(); palIndex = Math.min(palIndex + 1, palItems.length - 1); renderPalette(palItems); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); palIndex = Math.max(palIndex - 1, 0); renderPalette(palItems); }
    else if (e.key === 'Enter'){ e.preventDefault(); runPalette(palIndex); }
    else if (e.key === 'Escape'){ closePalette(); }
  });
  document.addEventListener('keydown', function(e){
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openPalette(); }
    if (e.key === 'Escape'){ closeSidebar(); closePalette(); }
  });

  window.addEventListener('hashchange', routeFromHash);

  // Database
  try {
    await openDB();
  } catch(err){
    db = null;
    fatalScreen(err);
    buildNav();
    updateNavActive();
    return;
  }

  updateStorageLine();

  await routeFromHash();

  logAct('system', 'Session started');
}

window.addEventListener('error', function(e){
  try { console.error('Unhandled error:', e.message); } catch(err){}
});
window.addEventListener('unhandledrejection', function(e){
  try { console.error('Unhandled rejection:', e.reason); } catch(err){}
});

boot();

})();
</script>
